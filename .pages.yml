# Pages CMS configuration: this decides the forms you see at app.pagescms.org
media:
  input: images
  output: /images

content:
  - name: settings
    label: ✦ Site design (pages, fonts, colours)
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: pages
        label: Pages in the side panel (drag to reorder, untick to hide)
        type: object
        list: true
        fields:
          - name: page
            label: Page
            type: select
            options: { values: [me, work, travel, podcast, blog, projects] }
          - { name: label, label: Name in the side panel, type: string }
          - { name: show, label: Show on the site, type: boolean }
      - name: font
        label: Font
        type: select
        options: { values: [book antiqua, garamond, elegant serif, modern sans, typewriter] }
      - name: text_size
        label: Text size
        type: select
        options: { values: [small, medium, large] }
      - name: accent
        label: Starting accent colour (visitors can change it with the dot)
        type: select
        options: { values: [terracotta, plum, forest, ink blue, rose, ochre, charcoal] }
      - name: background
        label: Morning background
        type: select
        options: { values: [cream, white, warm grey, blush] }
      - name: width
        label: Page width
        type: select
        options: { values: [narrow, medium, wide] }
      - { name: fairy_lights, label: Fairy lights along the top, type: boolean }
      - { name: typewriter, label: Type out the greeting, type: boolean }
      - { name: painted_dots, label: Painted dot before each heading, type: boolean }
      - name: photo_wall
        label: Travel photos
        type: select
        options: { values: [pegged on strings, simple grid] }
      - name: gallery_columns
        label: Painting gallery columns
        type: select
        options: { values: ["2", "3"] }

  - name: about
    label: "Get to know me: about, timeline, hobbies"
    type: file
    path: content/about.json
    format: json
    fields:
      - { name: name, label: Your full name, type: string }
      - name: panel
        label: Short hello in the side panel
        type: text
        description: "Wrap your name in ==double equals== to colour it."
      - { name: hello, label: "Greeting at the top (typed out)", type: string }
      - { name: tagline, label: One line under the greeting, type: string }
      - name: intro
        label: About me
        type: text
        description: "Leave a blank line between paragraphs. Wrap words in ==double equals== for a watercolour brushstroke."
      - { name: email, label: Email shown in the side panel, type: string }
      - name: timeline
        label: Timeline
        type: object
        list: true
        fields:
          - { name: when, label: "When (e.g. 2017 – 2021)", type: string }
          - { name: title, label: What, type: string, required: true }
          - { name: where, label: Where, type: string }
      - name: hobbies
        label: Hobbies
        type: object
        list: true
        fields:
          - { name: name, label: Hobby, type: string, required: true }
          - { name: text, label: A line or two, type: text }
          - { name: link, label: "Link (e.g. your Instagram)", type: string }

  - name: art
    label: "Get to know me: paintings"
    type: file
    path: content/art.json
    format: json
    fields:
      - { name: line, label: Small heading above the paintings, type: string }
      - name: pieces
        label: Paintings
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: year, label: Year, type: number }
          - { name: medium, label: "Medium (e.g. acrylic)", type: string }
          - name: shape
            label: Shape
            type: select
            options: { values: [portrait, square, landscape] }
          - { name: photo, label: Photo of the painting, type: image }

  - name: library
    label: "Get to know me: reading, listening, watching"
    type: file
    path: content/library.json
    format: json
    fields:
      - name: books
        label: Books
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: author, label: Author, type: string }
          - name: shelf
            label: Shelf
            type: select
            options: { values: [reading, read, someday] }
          - { name: rating, label: "Rating (0 to 5, 0 = no stars)", type: number }
          - { name: note, label: One line on it, type: string }
      - name: listening
        label: Listening to
        type: object
        list: true
        fields:
          - { name: title, label: "Song, album or podcast", type: string, required: true }
          - { name: artist, label: Artist or host, type: string }
          - { name: url, label: "Link (Spotify, YouTube…)", type: string }
      - name: films
        label: Watching
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: year, label: Year, type: number }
          - { name: score, label: "Score out of 10", type: number }
          - { name: note, label: One line on it, type: string }

  - name: work
    label: My 9–5
    type: file
    path: content/work.json
    format: json
    fields:
      - name: intro
        label: What you do
        type: text
      - { name: linkedin, label: LinkedIn link, type: string }
      - { name: resume, label: Résumé (PDF), type: file }
      - { name: skills, label: "What you're good at, separated by commas", type: string }
      - name: roles
        label: Where you've worked
        type: object
        list: true
        fields:
          - { name: title, label: Role, type: string, required: true }
          - { name: where, label: Company, type: string }
          - { name: when, label: "When (e.g. 2022 – now)", type: string }
          - { name: what, label: What you did, type: text }
          - { name: link, label: Link (optional), type: string }

  - name: travel
    label: Travel
    type: file
    path: content/travel.json
    format: json
    fields:
      - { name: line, label: Line under the heading, type: string }
      - name: photos
        label: Photos
        type: object
        list: true
        fields:
          - { name: place, label: Place, type: string, required: true }
          - { name: when, label: "When (e.g. dec 2024)", type: string }
          - { name: photo, label: Photo, type: image }
          - { name: story, label: A line or two about it, type: text }

  - name: podcast
    label: Podcast
    type: file
    path: content/podcast.json
    format: json
    fields:
      - { name: title, label: Heading, type: string }
      - { name: line, label: Line under the heading, type: string }
      - { name: youtube, label: YouTube channel link, type: string }
      - name: episodes
        label: Episodes
        type: object
        list: true
        fields:
          - { name: number, label: Episode number, type: number }
          - { name: title, label: Title, type: string, required: true }
          - { name: guest, label: Guest, type: string }
          - { name: url, label: Link to the episode, type: string }

  - name: musings
    label: "Blog: Substack posts"
    type: file
    path: content/musings.json
    format: json
    fields:
      - { name: line, label: Line under the heading, type: string }
      - { name: substack, label: Your Substack link, type: string }
      - name: posts
        label: Posts
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: date, label: Date, type: date }
          - { name: url, label: Link to the post on Substack, type: string }
          - { name: tags, label: "Tags, separated by commas", type: string }

  - name: archive
    label: "Blog: old posts"
    type: file
    path: content/archive.json
    format: json
    fields:
      - { name: line, label: Line under the heading, type: string }
      - name: posts
        label: Old posts
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: date, label: Date, type: date }
          - { name: url, label: Link (optional), type: string }

  - name: impact
    label: Projects
    type: file
    path: content/impact.json
    format: json
    fields:
      - { name: line, label: Line under the heading, type: string }
      - name: items
        label: Projects
        type: object
        list: true
        fields:
          - { name: title, label: Name, type: string, required: true }
          - { name: what, label: What it is, type: string }
          - { name: when, label: "Year (e.g. 2026)", type: string }
          - { name: url, label: Link (optional), type: string }
