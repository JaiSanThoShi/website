<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jai Santhoshi Sathish Kumar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Google+Sans+Flex:wght@400;500;600&family=Google+Sans+Code:wght@400;500&display=swap">
<style>
/* Layout: a warm side panel (name, accent dot, morning/night switch, a hello, six pixel-icon pages) beside one page at a time.
   Book Antiqua for reading, a small mono for dates and labels, one accent the visitor can change. */
:root {
  --page-light: #FFFDF8;
  --bg: var(--page-light);
  --panel: #F6F0E3;
  --panel-line: #E6DCC8;
  --ink: #2A2420;
  --muted: #7A7066;
  --line: #ECE4D8;
  --card: #FFFFFF;
  --soft: #EFE6D3;
  --accent: #B5522A;
  --accent-ink: var(--accent);
  --wood: #A9825C; --wood-dark: #7C5A3B;
  --font: "Google Sans Flex", "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --head: "Outfit", "Google Sans Flex", system-ui, sans-serif;
  --mono: "Google Sans Code", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --colw: 760px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="morning"]) { --bg: #14120F; --panel: #1B1814; --panel-line: #2C2722; --ink: #EDE6DC; --muted: #A2988C; --line: #2A2520; --card: #1C1915; --soft: #29241E; --accent-ink: color-mix(in srgb, var(--accent) 62%, #fff); color-scheme: dark; }
}
:root[data-theme="night"] { --bg: #14120F; --panel: #1B1814; --panel-line: #2C2722; --ink: #EDE6DC; --muted: #A2988C; --line: #2A2520; --card: #1C1915; --soft: #29241E; --accent-ink: color-mix(in srgb, var(--accent) 62%, #fff); color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.65; transition: background .35s, color .35s; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; border-radius: 6px; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: -.01em; }
.px { image-rendering: pixelated; shape-rendering: crispEdges; }

mark { color: inherit; padding: 0 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M2 9 C30 3 62 8 96 5 S160 2 198 7 L196 20 C150 23 110 18 70 21 S20 23 4 21 Z' fill='%23E8B86A' fill-opacity='.6'/></svg>") no-repeat 0 100% / 100% .85em; }
mark.b { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M2 9 C30 3 62 8 96 5 S160 2 198 7 L196 20 C150 23 110 18 70 21 S20 23 4 21 Z' fill='%23E39A8F' fill-opacity='.6'/></svg>"); }
mark.c { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M2 9 C30 3 62 8 96 5 S160 2 198 7 L196 20 C150 23 110 18 70 21 S20 23 4 21 Z' fill='%239DBFA8' fill-opacity='.6'/></svg>"); }
.panel-hello mark { background: none; color: var(--accent-ink); font-weight: 600; padding: 0; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); }

/* ── side panel ── */
.panel { position: fixed; top: 0; left: 0; bottom: 0; width: 300px; background: var(--panel); border-right: 1px solid var(--panel-line); display: flex; flex-direction: column; overflow-y: auto; z-index: 6; transition: background .35s;
  padding: calc(26px + env(safe-area-inset-top, 0px)) 22px 22px max(22px, env(safe-area-inset-left, 0px)); }
.panel-top { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; border-bottom: 1px solid var(--panel-line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--mono); font-weight: 500; font-size: 17px; letter-spacing: -.02em; min-width: 0; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--accent); cursor: pointer; flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); transition: transform .25s, background .3s; }
.dot:hover { transform: scale(1.12); }
.theme { width: 34px; height: 34px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; flex: none; transition: background .2s; }
.theme:hover { background: var(--soft); }
.theme svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
.theme .moon { display: none; }
:root[data-theme="night"] .theme .moon { display: block; } :root[data-theme="night"] .theme .sun { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="morning"]) .theme .moon { display: block; } :root:not([data-theme="morning"]) .theme .sun { display: none; } }
.panel-hello { padding: 18px 6px; border-bottom: 1px solid var(--panel-line); font-size: 16.5px; line-height: 1.6; }
.panel nav { display: grid; gap: 4px; padding: 16px 0; }
.panel nav a { display: flex; align-items: center; gap: 13px; padding: 9px 12px; border-radius: 10px; text-decoration: none; font-size: 18px; transition: background .2s; }
.panel nav a svg { width: 26px; height: 26px; flex: none; transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.panel nav a:hover { background: color-mix(in srgb, var(--soft) 70%, transparent); }
.panel nav a:hover svg { transform: rotate(-8deg) scale(1.08); }
.panel nav a.on { background: var(--soft); }
.panel-foot { margin-top: auto; padding: 14px 6px 0; border-top: 1px solid var(--panel-line); font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.panel-foot a { text-decoration: none; } .panel-foot a:hover { color: var(--accent-ink); }

/* ── content ── */
.content { margin-left: 300px; min-height: 100vh; }
.lights { display: block; width: 100%; height: 20px; }
.lights path { fill: none; stroke: color-mix(in srgb, var(--muted) 45%, transparent); stroke-width: 1; }
.lights .b { animation: twinkle 2.4s ease-in-out infinite alternate; }
.lights .b circle:first-child { fill: #FFD98A; opacity: .45; } .lights .b circle:last-child { fill: #F2B54B; }
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
body.no-lights .lights { display: none; }
.inner { max-width: var(--colw); padding: 46px max(36px, env(safe-area-inset-right, 0px)) 90px 56px; display: grid; gap: 56px; }
.fade { animation: fade .45s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
.page-title { display: flex; align-items: center; gap: 14px; }
.page-title svg { width: 38px; height: 38px; flex: none; }
.page-title h1 { font-weight: 600; font-size: clamp(30px, 4vw, 40px); line-height: 1.1; margin: 0; letter-spacing: -.015em; min-height: 1.1em; }
.caret { display: inline-block; width: .42em; height: .08em; background: var(--accent-ink); margin-left: 4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.lede { font-size: 19px; color: var(--muted); font-style: italic; margin-top: -40px; }
.prose { display: grid; gap: 14px; font-size: 18px; max-width: 62ch; }

section.blk { display: grid; gap: 16px; min-width: 0; }
.s-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
h2 { font-weight: 600; font-size: 22px; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
h2::before { content: ""; width: 12px; height: 10px; flex: none; border-radius: 52% 48% 55% 45% / 58% 46% 54% 42%; background: var(--dot, var(--accent)); opacity: .85; transform: rotate(-12deg); }
body.no-dots h2::before { display: none; }
.s-link { font-family: var(--mono); font-size: 12.5px; color: var(--accent-ink); text-decoration: none; white-space: nowrap; }
.s-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.s-line { color: var(--muted); }

.timeline { list-style: none; margin: 0; padding: 0 0 0 20px; border-left: 2px solid var(--line); display: grid; gap: 14px; }
.timeline li { position: relative; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: baseline; }
.timeline li::before { content: ""; position: absolute; left: -27px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent-ink); }
.timeline li:last-child::before { background: var(--accent-ink); }
.timeline b { font-weight: 600; }

.posts { list-style: none; padding: 0; margin: 0; display: grid; }
.posts li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.posts li:last-child { border-bottom: 0; }
.posts a { text-decoration: none; font-size: 17.5px; transition: color .2s; min-width: 0; }
.posts a:hover { color: var(--accent-ink); }
.posts .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.card { display: grid; gap: 7px; align-content: start; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); transition: border-color .2s, transform .2s, box-shadow .2s; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); transform: translateY(-2px); box-shadow: 0 14px 26px -22px rgba(40,25,10,.6); }
.card h3 { margin: 0; font-weight: 600; font-size: 19px; line-height: 1.25; }
.card p { color: var(--muted); font-size: 15.5px; line-height: 1.5; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn { font-family: var(--mono); font-size: 12.5px; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; background: var(--bg); transition: border-color .2s, color .2s; width: fit-content; }
.btn:hover { border-color: var(--accent-ink); color: var(--accent-ink); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* library */
.shelf { display: flex; align-items: flex-end; gap: 3px; height: 160px; padding: 0 8px; overflow-x: auto; scrollbar-width: none; }
.plank { height: 7px; background: var(--wood); border-bottom: 3px solid var(--wood-dark); border-radius: 0 0 2px 2px; }
.spine { flex: none; border: 0; border-radius: 2px 2px 0 0; color: #FFFDF8; display: grid; place-items: center; padding: 10px 0; cursor: pointer; transition: transform .25s; box-shadow: inset 2px 0 0 rgba(255,255,255,.18), inset -3px 0 0 rgba(0,0,0,.14); }
.spine:hover, .spine:focus-visible, .spine.on { transform: translateY(-8px); }
.spine span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 100%; }
.rack { display: flex; gap: 16px; overflow-x: auto; padding: 12px 4px 16px; scrollbar-width: none; }
.cd { flex: none; width: 100px; height: 100px; margin-right: 32px; background: none; border: 0; padding: 0; cursor: pointer; position: relative; text-align: left; }
.cd .disc { position: absolute; top: 4px; left: 4px; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle, #fff 0 9%, #D9D6D2 9.5% 11%, transparent 11.5%), conic-gradient(from 20deg, #E9E6F2, #F6E7D8, #DCEFE8, #E3E9F7, #F4DDE6, #E9E6F2); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .6s cubic-bezier(.3,1.2,.5,1); }
.cd .case { position: absolute; inset: 0; border-radius: 3px; overflow: hidden; box-shadow: 0 8px 16px -12px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.08); display: grid; align-content: end; padding: 8px 8px 8px 14px; color: #fff; }
.cd .case::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: rgba(0,0,0,.18); }
.cd .case::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.28), transparent 40%); }
.cd .case b { position: relative; z-index: 1; font-weight: 400; font-size: 13px; line-height: 1.1; }
.cd:hover .disc, .cd:focus-visible .disc { transform: translateX(26px) rotate(90deg); }
.cd.on .disc { animation: spin 3.2s linear infinite; }
@keyframes spin { from { transform: translateX(34px) rotate(0); } to { transform: translateX(34px) rotate(360deg); } }
.note { min-height: 3.2em; font-size: 15.5px; }
.note i { color: var(--muted); }
.tunes { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.tunes li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.tunes .vinyl { width: 34px; height: 34px; border-radius: 50%; flex: none; background: radial-gradient(circle, var(--accent) 0 18%, #2A2420 19% 100%); box-shadow: inset 0 0 0 4px #3A332D; animation: spin2 4s linear infinite; animation-play-state: paused; }
.tunes li:hover .vinyl { animation-play-state: running; }
@keyframes spin2 { to { transform: rotate(360deg); } }
.tunes b { font-weight: 600; } .tunes a { text-decoration: none; } .tunes a:hover { color: var(--accent-ink); }

/* travel */
.strings { display: grid; gap: 26px; }
.string { position: relative; display: flex; justify-content: space-around; gap: 10px; padding-top: 14px; }
.string::before { content: ""; position: absolute; left: -6px; right: -6px; top: 8px; height: 26px; border-top: 1.5px solid #8C7A66; border-radius: 50% 50% 0 0 / 100% 100% 0 0; transform: scaleY(-1); transform-origin: top; }
.pol { position: relative; flex: none; width: 150px; margin: 0; padding: 7px 7px 0; background: #fff; color: #23201D; border: 1px solid var(--line); box-shadow: 0 8px 14px -10px rgba(0,0,0,.35); cursor: zoom-in; transform-origin: 50% -10px; transform: rotate(var(--r)); transition: transform .4s cubic-bezier(.3,1.5,.5,1); }
.pol:hover, .pol:focus-visible { transform: rotate(0deg) translateY(2px); }
.pol::before { content: ""; position: absolute; top: -12px; left: 50%; width: 8px; height: 20px; margin-left: -4px; background: #C99A63; border-radius: 2px; }
.pol .ph { display: block; aspect-ratio: 1; background-size: cover; background-position: center; }
.pol figcaption { font-size: 13.5px; font-style: italic; text-align: center; padding: 5px 0 7px; }
body.wall-grid .strings { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
body.wall-grid .string { display: contents; }
body.wall-grid .string::before, body.wall-grid .pol::before { display: none; }
body.wall-grid .pol { width: auto; transform: none; }

/* art */
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px; align-items: end; }
body.gallery-2 .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.piece { width: 100%; background: none; border: 0; padding: 0; cursor: zoom-in; display: grid; gap: 8px; text-align: left; }
.frame { display: block; background: #2B2620; padding: 7px; box-shadow: 0 14px 22px -16px rgba(0,0,0,.6); transition: transform .3s; }
.frame .mat { display: block; background: #F8F4EC; padding: 9px; }
.frame .img { display: block; background-size: cover; background-position: center; }
.piece:hover .frame { transform: translateY(-3px); }
.piece .cap { font-size: 15px; line-height: 1.3; }
.piece .cap i { display: block; font-family: var(--mono); font-style: normal; font-size: 11.5px; color: var(--muted); }

dialog { border: 0; padding: 0; background: transparent; max-width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(20, 17, 14, .6); }
.lb { background: #fff; color: #23201D; border-radius: 8px; padding: 16px 16px 14px; display: grid; gap: 10px; position: relative; }
.lb .big { width: min(680px, calc(100vw - 64px)); aspect-ratio: var(--ar, 4/3); max-height: calc(100vh - 160px); background-size: contain; background-repeat: no-repeat; background-position: center; background-color: #F4F1EC; }
.lb a { color: #B5522A; }
.lb p { font-size: 15px; } .lb p i { color: #7A746C; }
.lb .x { position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: #23201D; color: #fff; cursor: pointer; font-size: 18px; }

@media (max-width: 860px) {
  .panel { position: sticky; top: 0; bottom: auto; width: auto; height: auto; overflow: visible; border-right: 0; border-bottom: 1px solid var(--panel-line);
    padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .panel-top { padding: 0 2px 10px; border-bottom: 0; }
  .panel-hello, .panel-foot { display: none; }
  .panel nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 0 10px; }
  .panel nav::-webkit-scrollbar { display: none; }
  .panel nav a { flex: none; font-size: 15px; padding: 7px 11px; gap: 8px; }
  .panel nav a svg { width: 20px; height: 20px; }
  .content { margin-left: 0; }
  .inner { padding: 30px max(18px, env(safe-area-inset-right, 0px)) 70px max(18px, env(safe-area-inset-left, 0px)); gap: 46px; }
  .lede { margin-top: -32px; }
}
@media (max-width: 560px) {
  .timeline li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .posts li { flex-direction: column; align-items: flex-start; gap: 4px; }
  .posts .meta { justify-content: flex-start; }
  .gallery, body.wall-grid .strings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pol { width: 104px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

/* headings in Outfit, like the reference */
.page-title h1, h2, .card h3 { font-family: var(--head); }
.page-title h1 { font-weight: 800; letter-spacing: -.02em; }
h2 { font-weight: 700; }
.card h3 { font-weight: 600; }
.lede { font-style: normal; }
.panel nav a { font-family: var(--font); font-weight: 500; }

/* old posts, read on the site */
.year { font-family: var(--head); font-weight: 700; font-size: 17px; margin-top: 10px; color: var(--muted); }
.post-body { display: grid; gap: 14px; }
.post-title { font-family: var(--head); font-weight: 800; font-size: clamp(28px, 4vw, 38px); line-height: 1.12; margin: 0; letter-spacing: -.015em; }
.meta-line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.post-html { font-size: 18px; line-height: 1.75; display: grid; gap: 12px; max-width: 66ch; }
.post-html p, .post-html ul, .post-html ol, .post-html blockquote, .post-html figure, .post-html h2, .post-html h3, .post-html h4 { margin: 0; }
.post-html h2, .post-html h3, .post-html h4 { font-family: var(--head); font-weight: 700; font-size: 21px; margin-top: 12px; }
.post-html img { max-width: 100%; height: auto; display: block; border-radius: 8px; margin: 8px 0; }
.post-html p:has(> img + img) { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.post-html p:has(> img + img) img { margin: 0; aspect-ratio: 1; object-fit: cover; }
.post-html blockquote { border-left: 3px solid var(--accent-ink); padding-left: 16px; color: var(--muted); font-style: italic; }
.post-html a { color: var(--accent-ink); }
.card.college { text-decoration: none; padding: 0 0 16px; overflow: hidden; }
.card.college > *:not(.cover) { padding: 0 16px; }
.card.college .cover { display: block; aspect-ratio: 16/10; background-size: cover; background-position: center; margin-bottom: 6px; }
</style>
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<aside class="panel" aria-label="Site">
  <div class="panel-top">
    <a class="brand" href="#me" id="brand"></a>
    <button class="dot" id="dot" aria-label="Change the accent colour" title="Change the colour"></button>
    <button class="theme" id="theme" aria-label="Switch between morning and night" title="Morning / night">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
  <div class="panel-hello" id="panel-hello"></div>
  <nav id="nav" aria-label="Pages"></nav>
  <div class="panel-foot" id="panel-foot"></div>
</aside>
<div class="content">
  <svg class="lights" id="lights" viewBox="0 0 1000 20" preserveAspectRatio="none" aria-hidden="true"></svg>
  <main class="inner" id="view"><p class="muted">Loading…</p></main>
</div>
<dialog id="lb"><div class="lb"><button class="x" id="lb-x" aria-label="Close">×</button><div class="big" id="lb-img"></div><p id="lb-cap"></p></div></dialog>

<script>
/* ════════════════════════════════════════════════════════════════
   Words, links, photos and design choices all live in content/,
   edited in Pages CMS (app.pagescms.org). This file only draws them.
   ════════════════════════════════════════════════════════════════ */
const FILES = ["settings", "about", "musings", "library", "travel", "art", "podcast", "impact", "work", "archive"];
const PAGES = [["me", "Get to know me"], ["work", "My 9–5"], ["travel", "Travel"], ["podcast", "Podcast"], ["blog", "Blog"], ["projects", "Projects"]];
const DOTS = ["#E8B86A", "#B8475A", "#7FA7C9", "#E39A8F", "#8C6BC0", "#9DBFA8", "#D9822B", "#4F6D7A"];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => d ? new Date(String(d).slice(0, 10) + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
const PAL = ["#2F4B7C", "#B8475A", "#3E7D6B", "#D9822B", "#6A4C93", "#C9A227", "#4F6D7A", "#9C5B44"];
const PAIRS = [["#7FA7C9", "#2F4B7C"], ["#E8A87C", "#B8475A"], ["#41B3A3", "#1F4E5F"], ["#E1C391", "#4F6D7A"], ["#C38D9E", "#6A4C93"], ["#E9D8A6", "#D9822B"], ["#C9A227", "#9C5B44"], ["#79A3A6", "#3E7D6B"]];
const pair = s => PAIRS[hash(s) % PAIRS.length];
const src = p => String(p || "").replace(/^\/+/, "");
const bg = (photo, key) => photo ? `background-image:url('${esc(src(photo))}')` : `background-image:linear-gradient(150deg, ${pair(key)[0]}, ${pair(key)[1]})`;
const SHAPE = { portrait: "4/5", square: "1/1", landscape: "4/3" };
const byDate = (a, b) => String(b.date || "").localeCompare(String(a.date || ""));
const list = t => String(t || "").split(",").map(x => x.trim()).filter(Boolean);
const marked = (t, cls = true) => { let i = 0; const m = ["", "b", "c"]; return esc(t || "").replace(/==(.+?)==/g, (x, w) => `<mark class="${cls ? m[i++ % 3] : ""}">${w}</mark>`); };
const paras = t => String(t || "").split(/\n\s*\n/).map(p => `<p>${marked(p)}</p>`).join("");

/* ── little pixel icons, drawn from text maps ── */
const COLORS = { k: "#2A2420", y: "#F5C542", r: "#E88B7A", b: "#A0673A", g: "#E0B04A", w: "#5FA8D3", G: "#6DAE5A", m: "#8E8780", h: "#C9C3BC", l: "#B8B0A6", W: "#FFFDF8", Y: "#F2C14E", R: "#D8574A", t: "#8C4A2F", T: "#C66B45", o: "#3B2A20", c: "#C48A55", B: "#F3E6D3", a: "var(--accent)", p: "var(--accent)", s: "#B9AFA4" };
const MAPS = {
  me: ["....yyyy....", "..yyyyyyyy..", ".yyyyyyyyyy.", ".yykyyyykyy.", "yyykyyyykyyy", "yyyyyyyyyyyy", "yrryyyyyyrry", "yyykyyyykyyy", ".yyykkkkyyy.", ".yyyyyyyyyy.", "..yyyyyyyy..", "....yyyy...."],
  work: ["............", "....kkkk....", "....k..k....", ".kkkkkkkkkk.", ".kbbbbbbbbk.", ".kbbbbbbbbk.", ".kkkkggkkkk.", ".kbbbggbbbk.", ".kbbbbbbbbk.", ".kbbbbbbbbk.", ".kkkkkkkkkk.", "............"],
  travel: ["....kkkk....", "..kkwwGGkk..", ".kwwwGGGwwk.", ".kwGGwGwwwk.", "kwwGGGwwwGGk", "kwwwGGwwGGGk", "kGwwwwwwGGGk", "kGGwwwwwwGGk", ".kGGwwwwwwk.", ".kwwwGGwwwk.", "..kkwwwwkk..", "....kkkk...."],
  podcast: ["....kkkk....", "...kmmmmk...", "...kmhmhk...", "...kmmmmk...", "...kmhmhk...", ".k.kmmmmk.k.", ".k..kkkk..k.", "..k......k..", "...kkkkkk...", ".....kk.....", "....kkkk....", "............"],
  blog: ["kkkkkkkkk...", "kWWWWWWWk.YY", "kWlllllWk.YY", "kWWWWWWWkYY.", "kWlllllWYY..", "kWWWWWWYYk..", "kWllllYYWk..", "kWWWWRWWWk..", "kWlllllWWk..", "kWWWWWWWWk..", "kkkkkkkkkk..", "............"],
  projects: ["............", ".....GG.....", "...GGGG.GG..", "..GGG.GGGGG.", "...GG.GGG...", ".....G......", ".....G......", "..tttttttt..", "..tTTTTTTt..", "...tTTTTt...", "...tTTTTt...", "....tttt...."],
  chai: ["................", "....s...s.......", ".....s...s......", "....s...s.......", "................", "..oooooooooo....", "..occcccccco....", "..oBBBBBBBBooo..", "..oBBBBBBBBo.o..", "..oaaaaaaaao.o..", "..oBBBBBBBBooo..", "...oBBBBBBo.....", "....oooooo......", ".pppppppppppp...", "................", "................"]
};
function pixel(name, cls = "") {
  const rows = MAPS[name], n = rows.length; let px = "";
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (COLORS[ch]) px += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${COLORS[ch]}"/>`; }));
  return `<svg class="px ${cls}" viewBox="0 0 ${n} ${n}" aria-hidden="true">${px}</svg>`;
}

/* ── design (content/settings.json) ── */
const ACCENTS = { terracotta: "#B5522A", plum: "#7A3E6B", forest: "#2F6B4F", "ink blue": "#2F4B7C", rose: "#B8475A", ochre: "#A8761E", charcoal: "#3A3632" };
const BACKGROUNDS = { white: "#FFFFFF", cream: "#FFFDF8", "warm grey": "#F7F5F2", blush: "#FFF8F6" };
const FONTS = {
  "outfit & google sans": { stack: '"Google Sans Flex", "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif', head: '"Outfit", "Google Sans Flex", system-ui, sans-serif' },
  "book antiqua": { stack: '"Book Antiqua", "Palatino Linotype", Palatino, "URW Palladio L", P052, Georgia, serif' },
  "garamond": { stack: '"EB Garamond", Garamond, Georgia, serif', google: "EB+Garamond:ital,wght@0,400;0,600;1,400" },
  "modern sans": { stack: '"Instrument Sans", "Helvetica Neue", system-ui, sans-serif', google: "Instrument+Sans:ital,wght@0,400;0,600;1,400" },
  "typewriter": { stack: '"Courier Prime", "Courier New", monospace', google: "Courier+Prime:ital,wght@0,400;0,700;1,400" },
  "elegant serif": { stack: '"Cormorant Garamond", Garamond, Georgia, serif', google: "Cormorant+Garamond:ital,wght@0,400;0,600;1,400" }
};
const WIDTHS = { narrow: "680px", medium: "760px", wide: "900px" };
const SIZES = { small: "16px", medium: "17px", large: "18.5px" };
let accentList = Object.values(ACCENTS), accentIdx = 0;

function applyDesign(S) {
  const root = document.documentElement.style, body = document.body.classList;
  const font = FONTS[S.font] || FONTS["outfit & google sans"];
  if (font.google) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = `https://fonts.googleapis.com/css2?family=${font.google}&display=swap`; document.head.appendChild(l); }
  root.setProperty("--font", font.stack);
  root.setProperty("--head", font.head || font.stack);
  let accent = ACCENTS[S.accent] || (/^#/.test(S.accent || "") ? S.accent : ACCENTS.terracotta);
  try { accent = localStorage.getItem("accent") || accent; } catch (e) {}
  accentIdx = Math.max(0, accentList.indexOf(accent));
  root.setProperty("--accent", accent);
  root.setProperty("--page-light", BACKGROUNDS[S.background] || BACKGROUNDS.cream);
  root.setProperty("--colw", WIDTHS[S.width] || WIDTHS.medium);
  document.body.style.fontSize = SIZES[S.text_size] || SIZES.medium;
  body.toggle("no-lights", S.fairy_lights === false);
  body.toggle("no-dots", S.painted_dots === false);
  body.toggle("no-type", S.typewriter === false);
  body.toggle("wall-grid", S.photo_wall === "simple grid");
  body.toggle("gallery-2", String(S.gallery_columns) === "2");
}

/* ── load everything, then draw ── */
let C = null;
Promise.all(FILES.map(f => fetch(`content/${f}.json`, { cache: "no-cache" }).then(r => r.ok ? r.json() : {}).catch(() => ({}))))
  .then(arr => { C = Object.fromEntries(FILES.map((f, i) => [f, arr[i] || {}])); setup(); route(); });

function setup() {
  const S = C.settings, A = C.about, M = C.musings, P = C.podcast, W = C.work;
  applyDesign(S);
  document.title = A.name || document.title;
  const short = String(A.name || "Jai Santhoshi").split(" ").slice(0, 2).join(" ").toLowerCase().replace(/\s+/g, "");
  document.getElementById("brand").innerHTML = `${pixel("chai")}<span>${esc(short)}</span>`;
  document.getElementById("panel-hello").innerHTML = marked(A.panel || A.tagline || "", false);
  const pages = (Array.isArray(S.pages) && S.pages.length ? S.pages : PAGES.map(([page, label]) => ({ page, label, show: true }))).filter(p => p.show !== false && PAGES.some(x => x[0] === p.page));
  C.pages = pages;
  document.getElementById("nav").innerHTML = pages.map(p => `<a href="#${p.page}" data-id="${p.page}">${pixel(p.page)}<span>${esc(p.label || PAGES.find(x => x[0] === p.page)[1])}</span></a>`).join("");
  const insta = (A.hobbies || []).map(h => h.link || "").find(l => /instagram/.test(l));
  const f = [[M.substack, "substack"], [P.youtube, "youtube"], [W.linkedin, "linkedin"], [insta, "instagram"]];
  document.getElementById("panel-foot").innerHTML = f.filter(x => x[0]).map(([h, n]) => `<a href="${esc(h)}" target="_blank" rel="noopener">${n} ↗</a>`).join("") + (A.email ? `<span style="user-select:all">${esc(A.email)}</span>` : "");
  const lights = document.getElementById("lights"); let d = "M0 3", bulbs = "";
  for (let x = 0; x <= 1000; x += 50) d += ` Q${x + 25} 15 ${x + 50} 3`;
  for (let k = 0, x = 25; x < 1000; x += 50, k++) bulbs += `<g class="b" style="animation-delay:-${(k * .37) % 2.4}s;animation-duration:${1.8 + (k % 5) * .3}s"><circle cx="${x}" cy="12" r="5"/><circle cx="${x}" cy="11.5" r="1.8"/></g>`;
  lights.innerHTML = `<path d="${d}"/>${bulbs}`;
}

/* ── page blocks ── */
const block = (title, body, link = "", i = 0) => `<section class="blk" style="--dot:${DOTS[i % DOTS.length]}"><div class="s-head"><h2>${esc(title)}</h2>${link}</div>${body}</section>`;
const ext = h => /^https?:/.test(h || "") ? ' target="_blank" rel="noopener"' : "";
const out = (href, text) => href ? `<a class="s-link" href="${esc(href)}"${ext(href)}>${text}${ext(href) ? " ↗" : " →"}</a>` : "";
const title = (page, text, typed) => `<div class="page-title">${pixel(page)}<h1 ${typed ? `id="typed" aria-label="${esc(text)}"><span class="txt" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span>` : `>${esc(text)}`}</h1></div>`;
const spine = (b, i) => { const h = hash(b.title); return `<button class="spine" data-i="${i}" style="background:${PAL[h % PAL.length]};height:${108 + h % 44}px;width:${Math.min(38, 22 + String(b.title).length * .7)}px" aria-label="${esc(b.title)} by ${esc(b.author)}"><span>${esc(b.title)}</span></button>`; };
const postRows = (posts, fallback) => `<ul class="posts">${posts.map(m => `<li>${(m.url || fallback) ? `<a href="${esc(m.url || fallback)}" target="_blank" rel="noopener">${esc(m.title)}</a>` : `<span>${esc(m.title)}</span>`}<span class="meta"><span class="mono muted">${fmt(m.date)}</span>${list(m.tags).map(x => `<span class="pill">${esc(x)}</span>`).join("")}</span></li>`).join("")}</ul>`;
const oldRows = posts => { const years = [...new Set(posts.map(p => String(p.date || "").slice(0, 4)))];
  return years.map(y => `<div class="year">${esc(y)}</div><ul class="posts">${posts.filter(p => String(p.date || "").startsWith(y)).map(p => `<li><a href="#read-${esc(p.slug)}">${esc(p.title)}</a><span class="meta"><span class="mono muted">${fmt(p.date)}</span>${list(p.tags).map(x => `<span class="pill">${esc(x)}</span>`).join("")}</span></li>`).join("")}</ul>`).join(""); };
const labelOf = id => (C.pages.find(p => p.page === id) || {}).label || (PAGES.find(p => p[0] === id) || [, id])[1];

const VIEW = {
  me() {
    const A = C.about, L = C.library, Ar = C.art, M = C.musings;
    const books = L.books || [], films = L.films || [], pieces = Ar.pieces || [];
    return `${title("me", A.hello || "Hey!", true)}
      ${A.tagline ? `<p class="lede">${esc(A.tagline)}</p>` : ""}
      ${block("About me", `<div class="prose">${paras(A.intro)}</div>${A.story ? `<a class="btn" href="#read-about-me">Read my whole story →</a>` : ""}`, "", 0)}
      ${block("Timeline", `<ol class="timeline">${(A.timeline || []).map(r => `<li><span class="mono muted">${esc(r.when)}</span><span><b>${esc(r.title)}</b>${r.where ? ` <span class="muted">· ${esc(r.where)}</span>` : ""}</span></li>`).join("")}</ol>`, "", 1)}
      ${(C.archive.college || []).length ? block("College days", `${C.archive.college_line ? `<p class="s-line">${esc(C.archive.college_line)}</p>` : ""}<div class="cards">${C.archive.college.map(c => `<a class="card college" href="#read-${esc(c.slug)}">${c.cover ? `<span class="cover" style="background-image:url('${esc(src(c.cover))}')"></span>` : ""}<h3>${esc(c.title)}</h3><p>${esc(c.line)}</p></a>`).join("")}</div>`, "", 7) : ""}
      ${block("My hobbies", `<div class="cards">${(A.hobbies || []).map(h => `<div class="card"><h3>${esc(h.name)}</h3><p>${esc(h.text)}</p>${h.link ? `<a class="btn" href="${esc(h.link)}"${ext(h.link)}>${ext(h.link) ? "Follow along ↗" : "Read more →"}</a>` : ""}</div>`).join("")}</div>
        ${pieces.length ? `<div class="mono muted" style="margin-top:8px">${esc(Ar.line || "From my easel")}</div><div class="gallery">${pieces.map((a, i) => `<button class="piece" data-i="${i}" aria-label="View ${esc(a.title)}"><span class="frame"><span class="mat"><span class="img" style="aspect-ratio:${SHAPE[a.shape] || "4/5"};${bg(a.photo, a.title)}"></span></span></span><span class="cap">${esc(a.title)}<i>${esc(a.year)}${a.medium ? " · " + esc(a.medium) : ""}</i></span></button>`).join("")}</div>` : ""}`, "", 2)}
      ${block("Latest on the blog", (M.posts || []).length ? postRows(M.posts.slice().sort(byDate).slice(0, 3), M.substack) : oldRows((C.archive.posts || []).slice().sort(byDate).slice(0, 3)).replace(/<div class="year">.*?<\/div>/g, ""), `<a class="s-link" href="#blog">All posts →</a>`, 3)}
      ${block("What I'm reading", `<div><div class="shelf">${books.map(spine).join("")}</div><div class="plank"></div></div><p class="note" id="book-note" aria-live="polite"></p>`, "", 4)}
      ${block("What I'm listening to", `<ul class="tunes">${(L.listening || []).map(t => `<li><span class="vinyl"></span><span>${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener"><b>${esc(t.title)}</b></a>` : `<b>${esc(t.title)}</b>`}${t.artist ? ` <span class="muted">· ${esc(t.artist)}</span>` : ""}</span></li>`).join("")}</ul>`, "", 5)}
      ${block("What I'm watching", `<div class="rack">${films.map((f, i) => `<button class="cd" data-i="${i}" aria-label="${esc(f.title)}, ${esc(f.score)} out of 10"><span class="disc"></span><span class="case" style="background:linear-gradient(160deg, ${pair(f.title)[0]}, ${pair(f.title)[1]})"><b>${esc(f.title)}</b></span></button>`).join("")}</div><p class="note" id="film-note" aria-live="polite"></p>`, "", 6)}`;
  },
  work() {
    const W = C.work;
    return `${title("work", labelOf("work"))}
      ${W.intro ? `<div class="prose">${paras(W.intro)}</div>` : ""}
      ${block("Where I've worked", `<div class="cards">${(W.roles || []).map(r => `<div class="card"><span class="mono muted">${esc(r.when)}</span><h3>${esc(r.title)}</h3>${r.where ? `<p><b style="font-weight:600;color:var(--ink)">${esc(r.where)}</b></p>` : ""}${r.what ? `<p>${esc(r.what)}</p>` : ""}${r.link ? `<a class="btn" href="${esc(r.link)}" target="_blank" rel="noopener">More ↗</a>` : ""}</div>`).join("")}</div>`, out(W.linkedin, "LinkedIn"), 0)}
      ${list(W.skills).length ? block("What I'm good at", `<div class="tags">${list(W.skills).map(s => `<span class="pill" style="font-size:13px;padding:4px 12px">${esc(s)}</span>`).join("")}</div>`, "", 1) : ""}
      ${W.resume ? `<a class="btn" href="${esc(src(W.resume))}" target="_blank" rel="noopener">Download my résumé ↗</a>` : ""}`;
  },
  travel() {
    const T = C.travel, photos = T.photos || [], rows = [];
    photos.forEach((p, i) => { if (i % 3 === 0) rows.push([]); rows[rows.length - 1].push([p, i]); });
    return `${title("travel", labelOf("travel"))}${T.line ? `<p class="lede">${esc(T.line)}</p>` : ""}
      <div class="strings">${rows.map(r => `<div class="string">${r.map(([p, i]) => `<figure class="pol" tabindex="0" role="button" data-i="${i}" style="--r:${(i % 2 ? 1 : -1) * (2 + i % 3)}deg"><span class="ph" style="${bg(p.photo, p.place)}"></span><figcaption>${esc(p.place)}</figcaption></figure>`).join("")}</div>`).join("")}</div>`;
  },
  podcast() {
    const P = C.podcast;
    return `${title("podcast", P.title || labelOf("podcast"))}${P.line ? `<p class="lede">${esc(P.line)}</p>` : ""}
      ${P.youtube ? `<a class="btn" href="${esc(P.youtube)}" target="_blank" rel="noopener">Watch on YouTube ↗</a>` : ""}
      ${block("Episodes", `<div class="cards">${(P.episodes || []).slice().sort((a, b) => (b.number || 0) - (a.number || 0)).map(e => `<div class="card"><span class="mono muted">Episode ${String(e.number ?? "").padStart(2, "0")}</span><h3>${esc(e.title)}</h3>${e.guest ? `<p>with ${esc(e.guest)}</p>` : ""}${e.url || P.youtube ? `<a class="btn" href="${esc(e.url || P.youtube)}" target="_blank" rel="noopener">Watch ↗</a>` : ""}</div>`).join("")}</div>`, "", 0)}`;
  },
  blog() {
    const M = C.musings, Ac = C.archive;
    return `${title("blog", labelOf("blog"))}${M.line ? `<p class="lede">${esc(M.line)}</p>` : ""}
      ${block("On Substack", (M.posts || []).length ? postRows(M.posts.slice().sort(byDate), M.substack) : `<p class="s-line">My Substack is coming soon.</p>`, out(M.substack, "Subscribe"), 0)}
      ${(Ac.posts || []).length ? block("From the old blog", `${Ac.line ? `<p class="s-line">${esc(Ac.line)}</p>` : ""}${oldRows((Ac.posts || []).slice().sort(byDate))}`, `<span class="mono muted">${Ac.posts.length} posts</span>`, 1) : ""}`;
  },
  read(slug) {
    const A = C.about, Ac = C.archive;
    let item = (Ac.posts || []).find(p => p.slug === slug), back = ["blog", "Blog"];
    if (!item) { item = (Ac.college || []).find(p => p.slug === slug); back = ["me", "Get to know me"]; }
    if (!item && slug === "about-me" && A.story) { item = { title: "My whole story", body: A.story }; back = ["me", "Get to know me"]; }
    if (!item) return `${title("blog", "Not found")}<p><a class="s-link" href="#blog">← Back to the blog</a></p>`;
    return `<a class="s-link" href="#${back[0]}">← ${esc(labelOf(back[0]) || back[1])}</a>
      <article class="post-body"><h1 class="post-title">${esc(item.title)}</h1>
      ${item.date || item.tags ? `<div class="meta-line"><span class="mono muted">${fmt(item.date)}</span>${list(item.tags).map(x => `<span class="pill">${esc(x)}</span>`).join("")}</div>` : ""}
      <div class="post-html">${String(item.body || "").replace(/src="\/+/g, 'src="')}</div></article>
      <a class="s-link" href="#${back[0]}">← ${esc(labelOf(back[0]) || back[1])}</a>`;
  },
  projects() {
    const I = C.impact;
    return `${title("projects", labelOf("projects"))}${I.line ? `<p class="lede">${esc(I.line)}</p>` : ""}
      <div class="cards">${(I.items || []).map(x => `<div class="card"><span class="mono muted">${esc(x.when)}</span><h3>${esc(x.title)}</h3><p>${esc(x.what)}</p>${x.url ? `<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Visit ↗</a>` : ""}</div>`).join("")}</div>`;
  }
};

/* ── routing: #me, #work, #travel, #podcast, #blog, #projects ── */
function route() {
  if (!C) return;
  const id = location.hash.slice(1), view = document.getElementById("view");
  const reading = id.startsWith("read-") ? id.slice(5) : null;
  const page = reading ? ((C.archive.posts || []).some(p => p.slug === reading) ? "blog" : "me") : C.pages.some(p => p.page === id) ? id : (C.pages[0] || { page: "me" }).page;
  view.innerHTML = reading ? VIEW.read(reading) : VIEW[page](); view.classList.remove("fade"); void view.offsetWidth; view.classList.add("fade");
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.id === page));
  if (reading) { window.scrollTo(0, 0); return; }
  window.scrollTo(0, 0);
  if (page === "me") { typeHello(); showBook(); showFilm(); }
}
window.addEventListener("hashchange", route);

function typeHello() {
  const node = document.querySelector("#typed .txt"); if (!node) return;
  const text = C.about.hello || "";
  let seen = false; try { seen = sessionStorage.getItem("typed") === "1"; } catch (e) {}
  if (seen || document.body.classList.contains("no-type") || matchMedia("(prefers-reduced-motion: reduce)").matches) { node.textContent = text; return; }
  let i = 0; (function tick() { if (!node.isConnected) return; node.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(tick, 70 + Math.random() * 45); else try { sessionStorage.setItem("typed", "1"); } catch (e) {} })();
}
function showBook(i) {
  const books = C.library.books || [], note = document.getElementById("book-note"); if (!note || !books.length) return;
  if (i === undefined) { i = books.findIndex(b => b.shelf === "reading"); if (i < 0) i = 0; }
  const b = books[i];
  document.querySelectorAll(".spine").forEach(s => s.classList.toggle("on", +s.dataset.i === i));
  note.innerHTML = `${esc(b.title)}, <i>${esc(b.author)}</i>${b.rating ? " · " + "★".repeat(b.rating) : b.shelf ? ` · <i>${esc(b.shelf)}</i>` : ""}<br><i>${esc(b.note)}</i>${b.review ? ` <a class="s-link" href="#read-${esc(b.review)}">Read my review →</a>` : ""}`;
}
function showFilm(i = 0) {
  const films = C.library.films || [], note = document.getElementById("film-note"); if (!note || !films.length) return;
  const f = films[i];
  document.querySelectorAll(".cd").forEach(c => c.classList.toggle("on", +c.dataset.i === i));
  note.innerHTML = `${esc(f.title)}${f.year ? ` <i>(${esc(f.year)})</i>` : ""}${f.score ? ` · ${esc(f.score)}/10` : ""}<br><i>${esc(f.note)}</i>`;
}

/* ── clicks: shelf, discs, photos, paintings ── */
const lb = document.getElementById("lb");
const openLb = (photo, key, ar, cap) => { document.getElementById("lb-img").style.cssText = `${bg(photo, key)};--ar:${ar}`; document.getElementById("lb-cap").innerHTML = cap; typeof lb.showModal === "function" ? lb.showModal() : lb.setAttribute("open", ""); };
document.getElementById("lb-x").onclick = () => lb.close();
lb.onclick = e => { if (e.target === lb) lb.close(); };
document.getElementById("view").addEventListener("click", e => {
  const s = e.target.closest(".spine"); if (s) return showBook(+s.dataset.i);
  const c = e.target.closest(".cd"); if (c) return showFilm(+c.dataset.i);
  const p = e.target.closest(".pol"); if (p) { const t = C.travel.photos[+p.dataset.i]; return openLb(t.photo, t.place, "4/3", `${esc(t.place)} <i>· ${esc(t.when)}</i>${t.story ? `<br>${esc(t.story)}` : ""}`); }
  const a = e.target.closest(".piece"); if (a) { const x = C.art.pieces[+a.dataset.i]; return openLb(x.photo, x.title, SHAPE[x.shape] || "4/5", `${esc(x.title)} <i>· ${esc(x.year)}${x.medium ? " · " + esc(x.medium) : ""}</i>${x.post ? ` · <a href="#read-${esc(x.post)}" onclick="document.getElementById('lb').close()">Read the post →</a>` : ""}`); }
});
document.getElementById("view").addEventListener("keydown", e => { const p = e.target.closest(".pol"); if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); p.click(); } });

/* ── morning / night, and the accent dot ── */
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const night = root.dataset.theme ? root.dataset.theme === "night" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = night ? "morning" : "night";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});
document.getElementById("dot").addEventListener("click", () => {
  accentIdx = (accentIdx + 1) % accentList.length;
  document.documentElement.style.setProperty("--accent", accentList[accentIdx]);
  try { localStorage.setItem("accent", accentList[accentIdx]); } catch (e) {}
});
</script>
</body>
</html>
