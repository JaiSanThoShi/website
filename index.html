<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jai Santhoshi Sathish Kumar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a header with name, sections and a theme switch; a hero beside a sticky column of links; then
   the sections as lists and cards. Book Antiqua for reading, a small mono for dates and tags, one accent. */
:root {
  --bg-light: #FFFFFF;
  --bg: var(--bg-light);
  --ink: #1F1C19;
  --muted: #6F6A64;
  --line: #E8E3DC;
  --card: #FFFFFF;
  --soft: #F7F4EF;
  --accent: #B5522A;
  --accent-ink: var(--accent);
  --wood: #A9825C; --wood-dark: #7C5A3B;
  --font: "Book Antiqua", "Palatino Linotype", Palatino, "URW Palladio L", P052, Georgia, serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --colw: 1080px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161412; --ink: #EDE7DF; --muted: #A39B91; --line: #2E2A26; --card: #1D1A17; --soft: #24201C; --accent-ink: color-mix(in srgb, var(--accent) 65%, #fff); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #161412; --ink: #EDE7DF; --muted: #A39B91; --line: #2E2A26; --card: #1D1A17; --soft: #24201C; --accent-ink: color-mix(in srgb, var(--accent) 65%, #fff); color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.65; padding-bottom: env(safe-area-inset-bottom, 0px); transition: background .3s, color .3s; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; border-radius: 4px; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 13px; letter-spacing: -.01em; }
.wrap { max-width: var(--colw); margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

/* watercolour brushstroke under highlighted words */
mark { color: inherit; padding: 0 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M2 9 C30 3 62 8 96 5 S160 2 198 7 L196 20 C150 23 110 18 70 21 S20 23 4 21 Z' fill='%23E8B86A' fill-opacity='.6'/></svg>") no-repeat 0 100% / 100% .85em; }
mark.b { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M2 9 C30 3 62 8 96 5 S160 2 198 7 L196 20 C150 23 110 18 70 21 S20 23 4 21 Z' fill='%23E39A8F' fill-opacity='.6'/></svg>"); }
mark.c { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M2 9 C30 3 62 8 96 5 S160 2 198 7 L196 20 C150 23 110 18 70 21 S20 23 4 21 Z' fill='%239DBFA8' fill-opacity='.6'/></svg>"); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.top .wrap { display: flex; align-items: center; gap: 28px; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; font-size: 17px; white-space: nowrap; flex: none; }
.brand svg { width: 26px; height: 26px; image-rendering: pixelated; }
#topnav { display: flex; gap: 22px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
#topnav::-webkit-scrollbar { display: none; }
#topnav a { text-decoration: none; color: var(--muted); font-size: 15.5px; white-space: nowrap; padding: 4px 0; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s; }
#topnav a:hover { color: var(--ink); }
#topnav a.on { color: var(--ink); border-bottom-color: var(--accent-ink); }
.theme { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: grid; place-items: center; transition: border-color .2s; }
.theme:hover { border-color: var(--accent-ink); }
.theme svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
.theme .sun { display: none; }
:root[data-theme="dark"] .theme .sun { display: block; } :root[data-theme="dark"] .theme .moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme .sun { display: block; } :root:not([data-theme="light"]) .theme .moon { display: none; } }
.lights { display: block; width: 100%; height: 18px; position: absolute; left: 0; bottom: -18px; pointer-events: none; }
.lights path { fill: none; stroke: color-mix(in srgb, var(--muted) 45%, transparent); stroke-width: 1; }
.lights .b { animation: twinkle 2.4s ease-in-out infinite alternate; }
.lights .b circle:first-child { fill: #FFD98A; opacity: .45; } .lights .b circle:last-child { fill: #F2B54B; }
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }

/* page grid */
.page { display: grid; grid-template-columns: minmax(0, 1fr) 260px; grid-template-areas: "hero side" "body side"; column-gap: 64px; padding-block: 64px 100px; }
.hero { grid-area: hero; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; padding-bottom: 56px; }
.hero h1 { font-weight: 600; font-size: clamp(34px, 5vw, 48px); line-height: 1.08; margin: 0 0 10px; letter-spacing: -.015em; min-height: 1.08em; }
.hero .tag { font-size: 19px; color: var(--muted); margin-bottom: 18px; font-style: italic; }
.hero .intro { font-size: 18.5px; max-width: 58ch; }
.caret { display: inline-block; width: .42em; height: .08em; background: var(--accent-ink); margin-left: 4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.chai { width: 112px; height: 112px; image-rendering: pixelated; }
.chai .steam { animation: steam 2.4s ease-in-out infinite; }
.chai .steam.two { animation-delay: -1.2s; }
@keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-3px); } }

aside.side { grid-area: side; }
.side-in { position: sticky; top: 96px; display: grid; gap: 22px; }
.side-card { border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; background: var(--card); }
.side-card h3 { margin: 0 0 8px; font-size: 13px; font-family: var(--mono); font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.side-links { list-style: none; padding: 0; margin: 0; display: grid; }
.side-links a, .side-links span { display: flex; align-items: center; gap: 10px; padding: 6px 0; text-decoration: none; font-size: 16px; }
.side-links a:hover { color: var(--accent-ink); }
.side-links svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; opacity: .75; }
.side-links .email { font-size: 14px; color: var(--muted); user-select: all; word-break: break-all; }

main#body { grid-area: body; display: grid; gap: 72px; min-width: 0; }
section { display: grid; gap: 18px; scroll-margin-top: 90px; min-width: 0; }
.s-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
h2 { font-weight: 600; font-size: 24px; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 11px; }
h2::before { content: ""; width: 13px; height: 11px; flex: none; border-radius: 52% 48% 55% 45% / 58% 46% 54% 42%; background: var(--dot, var(--accent)); opacity: .85; transform: rotate(-12deg); }
.s-link { font-family: var(--mono); font-size: 13px; color: var(--accent-ink); text-decoration: none; white-space: nowrap; }
.s-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.s-line { color: var(--muted); }

/* timeline */
.timeline { list-style: none; margin: 0; padding: 0 0 0 20px; border-left: 2px solid var(--line); display: grid; gap: 14px; }
.timeline li { position: relative; display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; align-items: baseline; }
.timeline li::before { content: ""; position: absolute; left: -27px; top: 8px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent-ink); }
.timeline li:last-child::before { background: var(--accent-ink); }
.timeline b { font-weight: 600; }

/* post rows */
.posts { list-style: none; padding: 0; margin: 0; display: grid; }
.posts li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.posts li:last-child { border-bottom: 0; }
.posts a { text-decoration: none; font-size: 18px; transition: color .2s; min-width: 0; }
.posts a:hover { color: var(--accent-ink); }
.posts .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { display: grid; gap: 8px; align-content: start; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); transition: border-color .2s, transform .2s, box-shadow .2s; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); transform: translateY(-2px); box-shadow: 0 14px 26px -22px rgba(40,25,10,.6); }
.card h3 { margin: 0; font-weight: 600; font-size: 19px; line-height: 1.25; }
.card p { color: var(--muted); font-size: 15.5px; line-height: 1.5; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn { font-family: var(--mono); font-size: 12.5px; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; background: var(--bg); transition: border-color .2s, color .2s; }
.btn:hover { border-color: var(--accent-ink); color: var(--accent-ink); }

/* library */
.shelf-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.shelf { display: flex; align-items: flex-end; gap: 3px; height: 170px; padding: 0 8px; overflow-x: auto; scrollbar-width: none; }
.plank { height: 7px; background: var(--wood); border-bottom: 3px solid var(--wood-dark); border-radius: 0 0 2px 2px; }
.spine { flex: none; border: 0; border-radius: 2px 2px 0 0; color: #FFFDF8; display: grid; place-items: center; padding: 10px 0; cursor: pointer; transition: transform .25s; box-shadow: inset 2px 0 0 rgba(255,255,255,.18), inset -3px 0 0 rgba(0,0,0,.14); }
.spine:hover, .spine:focus-visible, .spine.on { transform: translateY(-8px); }
.spine span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 100%; }
.rack { display: flex; gap: 16px; overflow-x: auto; padding: 14px 4px 18px; scrollbar-width: none; }
.cd { flex: none; width: 108px; height: 108px; margin-right: 34px; background: none; border: 0; padding: 0; cursor: pointer; position: relative; text-align: left; }
.cd .disc { position: absolute; top: 4px; left: 4px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #fff 0 9%, #D9D6D2 9.5% 11%, transparent 11.5%), conic-gradient(from 20deg, #E9E6F2, #F6E7D8, #DCEFE8, #E3E9F7, #F4DDE6, #E9E6F2); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .6s cubic-bezier(.3,1.2,.5,1); }
.cd .case { position: absolute; inset: 0; border-radius: 3px; overflow: hidden; box-shadow: 0 8px 16px -12px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.08); display: grid; align-content: end; padding: 8px 8px 8px 14px; color: #fff; }
.cd .case::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: rgba(0,0,0,.18); }
.cd .case::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.28), transparent 40%); }
.cd .case b { position: relative; z-index: 1; font-weight: 400; font-size: 13.5px; line-height: 1.1; }
.cd:hover .disc, .cd:focus-visible .disc { transform: translateX(28px) rotate(90deg); }
.cd.on .disc { animation: spin 3.2s linear infinite; }
@keyframes spin { from { transform: translateX(38px) rotate(0); } to { transform: translateX(38px) rotate(360deg); } }
.note { min-height: 3.2em; font-size: 15.5px; }
.note i { color: var(--muted); }
.sub { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: -6px; }

/* travel photo wall */
.strings { display: grid; gap: 26px; }
.string { position: relative; display: flex; justify-content: space-around; gap: 10px; padding-top: 14px; }
.string::before { content: ""; position: absolute; left: -6px; right: -6px; top: 8px; height: 26px; border-top: 1.5px solid #8C7A66; border-radius: 50% 50% 0 0 / 100% 100% 0 0; transform: scaleY(-1); transform-origin: top; }
.pol { position: relative; flex: none; width: 140px; margin: 0; padding: 7px 7px 0; background: #fff; color: #23201D; border: 1px solid var(--line); box-shadow: 0 8px 14px -10px rgba(0,0,0,.35); cursor: zoom-in; transform-origin: 50% -10px; transform: rotate(var(--r)); transition: transform .4s cubic-bezier(.3,1.5,.5,1); }
.pol:hover, .pol:focus-visible { transform: rotate(0deg) translateY(2px); }
.pol::before { content: ""; position: absolute; top: -12px; left: 50%; width: 8px; height: 20px; margin-left: -4px; background: #C99A63; border-radius: 2px; }
.pol .ph { display: block; aspect-ratio: 1; background-size: cover; background-position: center; }
.pol figcaption { font-size: 13px; font-style: italic; text-align: center; padding: 5px 0 7px; }
body.wall-grid .strings { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
body.wall-grid .string { display: contents; }
body.wall-grid .string::before, body.wall-grid .pol::before { display: none; }
body.wall-grid .pol { width: auto; transform: none; }

/* art gallery */
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 22px; align-items: end; }
body.gallery-2 .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.piece { width: 100%; background: none; border: 0; padding: 0; cursor: zoom-in; display: grid; gap: 8px; text-align: left; }
.frame { display: block; background: #2B2620; padding: 7px; box-shadow: 0 14px 22px -16px rgba(0,0,0,.6); transition: transform .3s; }
.frame .mat { display: block; background: #F8F4EC; padding: 9px; }
.frame .img { display: block; background-size: cover; background-position: center; }
.piece:hover .frame { transform: translateY(-3px); }
.piece .cap { font-size: 15.5px; line-height: 1.3; }
.piece .cap i { display: block; font-family: var(--mono); font-style: normal; font-size: 12px; color: var(--muted); }

/* lightbox */
dialog { border: 0; padding: 0; background: transparent; max-width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(20, 17, 14, .6); }
.lb { background: #fff; color: #23201D; border-radius: 8px; padding: 16px 16px 14px; display: grid; gap: 10px; position: relative; }
.lb .big { width: min(680px, calc(100vw - 64px)); aspect-ratio: var(--ar, 4/3); max-height: calc(100vh - 160px); background-size: cover; background-position: center; }
.lb p { font-size: 15px; } .lb p i { color: #7A746C; }
.lb .x { position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: #23201D; color: #fff; cursor: pointer; font-size: 18px; }

footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 26px 34px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
footer a { color: var(--muted); text-decoration: none; margin-left: 16px; }
footer a:hover { color: var(--accent-ink); }

/* switches from the Site design form */
body.no-lights .lights { display: none; }
body.no-dots h2::before { display: none; }

@media (max-width: 900px) {
  .page { grid-template-columns: minmax(0, 1fr); grid-template-areas: "hero" "side" "body"; padding-block: 40px 80px; }
  .side-in { position: static; }
  aside.side { margin-bottom: 56px; }
  .side-links { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 14px; }
  .side-links li:last-child { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .top .wrap { flex-wrap: wrap; gap: 10px 16px; }
  #topnav { order: 3; flex-basis: 100%; gap: 18px; }
  .theme { margin-left: auto; }
  .hero { grid-template-columns: minmax(0, 1fr); padding-bottom: 36px; }
  .chai { width: 84px; height: 84px; order: -1; }
  .timeline li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .posts li { flex-direction: column; align-items: flex-start; gap: 4px; }
  .posts .meta { justify-content: flex-start; }
  .gallery, body.wall-grid .strings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pol { width: 104px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
</style>
<script>
  /* apply a saved light/dark choice before the page paints */
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav id="topnav" aria-label="Sections"></nav>
    <button class="theme" id="theme" aria-label="Switch between light and dark">
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <svg class="lights" id="lights" viewBox="0 0 1000 18" preserveAspectRatio="none" aria-hidden="true"></svg>
</header>

<div class="wrap page" id="top">
  <div class="hero" id="hero"></div>
  <aside class="side" aria-label="Find me"><div class="side-in" id="side"></div></aside>
  <main id="body"><p class="muted">Loading…</p></main>
</div>
<footer><div class="wrap" id="foot"></div></footer>
<dialog id="lb"><div class="lb"><button class="x" id="lb-x" aria-label="Close">×</button><div class="big" id="lb-img"></div><p id="lb-cap"></p></div></dialog>

<script>
/* ════════════════════════════════════════════════════════════════
   All words, links, photos and design choices live in content/,
   one file per section, edited in Pages CMS (app.pagescms.org).
   This file only decides how they look.
   ════════════════════════════════════════════════════════════════ */
const FILES = ["settings", "about", "musings", "library", "travel", "art", "podcast", "fitness", "impact", "work", "archive"];
const DEFAULT_SECTIONS = [
  ["work", "A brief timeline", "Timeline"], ["musings", "Latest musings", "Musings"], ["library", "Library", "Library"],
  ["travel", "Travel", "Travel"], ["art", "Art", "Art"], ["ground-up", "Ground Up", "Ground Up"],
  ["impact", "Projects & impact", "Projects"], ["fitness", "Fitness", "Fitness"], ["archive", "Archive", "Archive"]
];
const DOTS = ["#E8B86A", "#B8475A", "#7FA7C9", "#E39A8F", "#8C6BC0", "#9DBFA8", "#D9822B", "#4F6D7A", "#9C5B44"];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => d ? new Date(String(d).slice(0, 10) + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
const PAL = ["#2F4B7C", "#B8475A", "#3E7D6B", "#D9822B", "#6A4C93", "#C9A227", "#4F6D7A", "#9C5B44"];
const PAIRS = [["#7FA7C9", "#2F4B7C"], ["#E8A87C", "#B8475A"], ["#41B3A3", "#1F4E5F"], ["#E1C391", "#4F6D7A"], ["#C38D9E", "#6A4C93"], ["#E9D8A6", "#D9822B"], ["#C9A227", "#9C5B44"], ["#79A3A6", "#3E7D6B"]];
const pair = s => PAIRS[hash(s) % PAIRS.length];
const src = p => String(p || "").replace(/^\/+/, "");
const bg = (photo, key) => photo ? `background-image:url('${esc(src(photo))}')` : `background-image:linear-gradient(150deg, ${pair(key)[0]}, ${pair(key)[1]})`;
const SHAPE = { portrait: "4/5", square: "1/1", landscape: "4/3" };
const byDate = (a, b) => String(b.date || "").localeCompare(String(a.date || ""));
const tagsOf = t => String(t || "").split(",").map(x => x.trim()).filter(Boolean);
const ICON = {
  substack: '<path d="M5 4h14M5 8h14M5 12h14v8l-7-4-7 4z"/>',
  youtube: '<rect x="3" y="6" width="18" height="12" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
  linkedin: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7"/>',
  instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5v.01"/>',
  resume: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

/* a little pixel cup of chai, with steam */
const CHAI = [
  "................", "....s...s.......", ".....s...s......", "....s...s.......", "................",
  "..oooooooooo....", "..occcccccco....", "..obbbbbbbbooo..", "..obbbbbbbbo.o..", "..oaaaaaaaao.o..",
  "..obbbbbbbbooo..", "...obbbbbbo.....", "....oooooo......", ".pppppppppppp...", "................", "................"];
function chaiSVG(cls) {
  const col = { o: "#3B2A20", c: "#C48A55", b: "#F3E6D3", a: "var(--accent)", p: "var(--accent)" };
  let px = "", steam1 = "", steam2 = "";
  CHAI.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === "s") { const r = `<rect x="${x}" y="${y}" width="1" height="1" fill="#B9AFA4"/>`; if (x < 7) steam1 += r; else steam2 += r; }
    else if (col[ch]) px += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${col[ch]}"/>`;
  }));
  return `<svg class="${cls}" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><g class="steam">${steam1}</g><g class="steam two">${steam2}</g>${px}</svg>`;
}

/* ════════════ DESIGN (content/settings.json) ════════════ */
const ACCENTS = { terracotta: "#B5522A", plum: "#7A3E6B", forest: "#2F6B4F", "ink blue": "#2F4B7C", rose: "#B8475A", ochre: "#A8761E", charcoal: "#3A3632" };
const BACKGROUNDS = { white: "#FFFFFF", cream: "#FBF7EF", "warm grey": "#F5F3F0", blush: "#FCF5F3" };
const FONTS = {
  "book antiqua": { stack: '"Book Antiqua", "Palatino Linotype", Palatino, "URW Palladio L", P052, Georgia, serif' },
  "garamond": { stack: '"EB Garamond", Garamond, Georgia, serif', google: "EB+Garamond:ital,wght@0,400;0,600;1,400" },
  "modern sans": { stack: '"Instrument Sans", "Helvetica Neue", system-ui, sans-serif', google: "Instrument+Sans:ital,wght@0,400;0,600;1,400" },
  "typewriter": { stack: '"Courier Prime", "Courier New", monospace', google: "Courier+Prime:ital,wght@0,400;0,700;1,400" },
  "elegant serif": { stack: '"Cormorant Garamond", Garamond, Georgia, serif', google: "Cormorant+Garamond:ital,wght@0,400;0,600;1,400" }
};
const WIDTHS = { narrow: "940px", medium: "1080px", wide: "1220px" };
const SIZES = { small: "16px", medium: "17px", large: "18.5px" };

function applyDesign(S) {
  const root = document.documentElement.style, body = document.body.classList;
  const font = FONTS[S.font] || FONTS["book antiqua"];
  if (font.google) { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = `https://fonts.googleapis.com/css2?family=${font.google}&display=swap`; document.head.appendChild(l); }
  root.setProperty("--font", font.stack);
  root.setProperty("--accent", ACCENTS[S.accent] || (/^#/.test(S.accent || "") ? S.accent : ACCENTS.terracotta));
  root.setProperty("--bg-light", BACKGROUNDS[S.background] || "#FFFFFF");
  root.setProperty("--colw", WIDTHS[S.width] || WIDTHS.medium);
  document.body.style.fontSize = SIZES[S.text_size] || SIZES.medium;
  body.toggle("no-lights", S.fairy_lights === false);
  body.toggle("no-dots", S.painted_dots === false);
  body.toggle("no-type", S.typewriter === false);
  body.toggle("wall-grid", S.photo_wall === "simple grid");
  body.toggle("gallery-2", String(S.gallery_columns) === "2");
}

/* ════════════ RENDER ════════════ */
Promise.all(FILES.map(f => fetch(`content/${f}.json`, { cache: "no-cache" }).then(r => r.ok ? r.json() : {}).catch(() => ({}))))
  .then(arr => render(Object.fromEntries(FILES.map((f, i) => [f, arr[i] || {}]))));

function render(C) {
  const S = C.settings, A = C.about, M = C.musings, Lb = C.library, T = C.travel, Ar = C.art, P = C.podcast, F = C.fitness, I = C.impact, W = C.work, Ac = C.archive;
  const books = Lb.books || [], films = Lb.films || [], photos = T.photos || [], pieces = Ar.pieces || [];
  applyDesign(S);
  document.title = A.name || document.title;
  const first = String(A.name || "Jai Santhoshi").split(" ").slice(0, 2).join(" ");

  /* header */
  document.getElementById("brand").innerHTML = `${chaiSVG("")}<span>${esc(first)}</span>`;
  const lights = document.getElementById("lights"); let d = "M0 3", bulbs = "";
  for (let x = 0; x <= 1000; x += 50) d += ` Q${x + 25} 14 ${x + 50} 3`;
  for (let k = 0, x = 25; x < 1000; x += 50, k++) bulbs += `<g class="b" style="animation-delay:-${(k * .37) % 2.4}s;animation-duration:${1.8 + (k % 5) * .3}s"><circle cx="${x}" cy="11" r="5"/><circle cx="${x}" cy="10.5" r="1.8"/></g>`;
  lights.innerHTML = `<path d="${d}"/>${bulbs}`;

  /* hero */
  let mi = 0; const marks = ["", "b", "c"];
  const intro = esc(A.intro || "").replace(/==(.+?)==/g, (m, w) => `<mark class="${marks[mi++ % 3]}">${w}</mark>`).split(/\n\s*\n/).map(p => `<p>${p}</p>`).join("");
  document.getElementById("hero").innerHTML = `<div>
      <h1 id="typed" aria-label="${esc(A.hello)}"><span class="txt" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span></h1>
      ${A.tagline ? `<p class="tag">${esc(A.tagline)}</p>` : ""}
      <div class="intro">${intro}</div></div>${chaiSVG("chai")}`;

  /* side links */
  const link = (href, k, label) => href ? `<li><a href="${esc(href)}" target="_blank" rel="noopener">${icon(k)}${label}</a></li>` : "";
  document.getElementById("side").innerHTML = `<div class="side-card"><h3>Find me</h3><ul class="side-links">
      ${link(M.substack, "substack", "Substack")}${link(P.youtube, "youtube", "YouTube")}${link(W.linkedin, "linkedin", "LinkedIn")}${link(F.instagram, "instagram", "Instagram")}${W.resume ? link(src(W.resume), "resume", "Résumé") : ""}
      ${A.email ? `<li><span>${icon("mail")}<span class="email">${esc(A.email)}</span></span></li>` : ""}</ul></div>`;

  /* sections */
  const spine = (b, i) => { const h = hash(b.title);
    return `<button class="spine" data-i="${i}" style="background:${PAL[h % PAL.length]};height:${112 + h % 46}px;width:${Math.min(38, 22 + String(b.title).length * .7)}px" aria-label="${esc(b.title)} by ${esc(b.author)}"><span>${esc(b.title)}</span></button>`; };
  const strings = []; photos.forEach((p, i) => { if (i % 3 === 0) strings.push([]); strings[strings.length - 1].push([p, i]); });
  const head = (title, linkHtml = "") => `<div class="s-head"><h2>${esc(title)}</h2>${linkHtml}</div>`;
  const out = (href, text) => href ? `<a class="s-link" href="${esc(href)}" target="_blank" rel="noopener">${text} ↗</a>` : "";

  const SEC = {
    work: t => `${head(t, out(W.linkedin, "LinkedIn"))}${W.line ? `<p class="s-line">${esc(W.line)}</p>` : ""}
      <ol class="timeline">${(W.roles || []).map(r => `<li><span class="mono muted">${esc(r.when)}</span><span>${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener"><b>${esc(r.title)}</b></a>` : `<b>${esc(r.title)}</b>`}${r.where ? ` <span class="muted">· ${esc(r.where)}</span>` : ""}</span></li>`).join("")}</ol>`,
    musings: t => `${head(t, out(M.substack, "All on Substack"))}${M.line ? `<p class="s-line">${esc(M.line)}</p>` : ""}
      <ul class="posts">${(M.posts || []).slice().sort(byDate).map(m => `<li><a href="${esc(m.url || M.substack)}" target="_blank" rel="noopener">${esc(m.title)}</a><span class="meta"><span class="mono muted">${fmt(m.date)}</span>${tagsOf(m.tags).map(x => `<span class="pill">${esc(x)}</span>`).join("")}</span></li>`).join("")}</ul>`,
    library: t => `${head(t)}${Lb.line ? `<p class="s-line">${esc(Lb.line)}</p>` : ""}
      <div class="sub">Books · ${books.length}</div><div><div class="shelf">${books.map(spine).join("")}</div><div class="plank"></div></div>
      <div class="sub">Films · ${films.length}</div><div class="rack">${films.map((f, i) => `<button class="cd" data-i="${i}" aria-label="${esc(f.title)}, ${esc(f.score)} out of 10"><span class="disc"></span><span class="case" style="background:linear-gradient(160deg, ${pair(f.title)[0]}, ${pair(f.title)[1]})"><b>${esc(f.title)}</b></span></button>`).join("")}</div>
      <p class="note" id="note" aria-live="polite"></p>`,
    travel: t => `${head(t)}${T.line ? `<p class="s-line">${esc(T.line)}</p>` : ""}
      <div class="strings">${strings.map(row => `<div class="string">${row.map(([p, i]) => `<figure class="pol" tabindex="0" role="button" data-i="${i}" style="--r:${(i % 2 ? 1 : -1) * (2 + i % 3)}deg"><span class="ph" style="${bg(p.photo, p.place)}"></span><figcaption>${esc(p.place)}</figcaption></figure>`).join("")}</div>`).join("")}</div>`,
    art: t => `${head(t)}${Ar.line ? `<p class="s-line">${esc(Ar.line)}</p>` : ""}
      <div class="gallery">${pieces.map((a, i) => `<button class="piece" data-i="${i}" aria-label="View ${esc(a.title)}"><span class="frame"><span class="mat"><span class="img" style="aspect-ratio:${SHAPE[a.shape] || "4/5"};${bg(a.photo, a.title)}"></span></span></span><span class="cap">${esc(a.title)}<i>${esc(a.year)}${a.medium ? " · " + esc(a.medium) : ""}</i></span></button>`).join("")}</div>`,
    "ground-up": t => `${head(t, out(P.youtube, "YouTube"))}${P.line ? `<p class="s-line">${esc(P.line)}</p>` : ""}
      <div class="cards">${(P.episodes || []).slice().sort((a, b) => (b.number || 0) - (a.number || 0)).map(e => `<div class="card"><span class="mono muted">Episode ${String(e.number ?? "").padStart(2, "0")}</span><h3>${esc(e.title)}</h3>${e.guest ? `<p>with ${esc(e.guest)}</p>` : ""}<div class="btns">${e.url || P.youtube ? `<a class="btn" href="${esc(e.url || P.youtube)}" target="_blank" rel="noopener">Watch ↗</a>` : ""}</div></div>`).join("")}</div>`,
    impact: t => `${head(t)}${I.line ? `<p class="s-line">${esc(I.line)}</p>` : ""}
      <div class="cards">${(I.items || []).map(x => `<div class="card"><span class="mono muted">${esc(x.when)}</span><h3>${esc(x.title)}</h3><p>${esc(x.what)}</p>${x.url ? `<div class="btns"><a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Visit ↗</a></div>` : ""}</div>`).join("")}</div>`,
    fitness: t => `${head(t, out(F.instagram, "Instagram"))}<p>${esc(F.text)}</p>`,
    archive: t => `${head(t)}${Ac.line ? `<p class="s-line">${esc(Ac.line)}</p>` : ""}
      <ul class="posts">${(Ac.posts || []).slice().sort(byDate).map(x => `<li>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : `<span>${esc(x.title)}</span>`}<span class="meta"><span class="mono muted">${fmt(x.date)}</span></span></li>`).join("")}</ul>`
  };

  /* order, names and visibility come from the Site design form */
  const order = Array.isArray(S.sections) && S.sections.length ? S.sections : DEFAULT_SECTIONS.map(([section, label]) => ({ section, label, show: true }));
  const seen = new Set(), shown = [];
  order.forEach(o => { if (!SEC[o.section] || seen.has(o.section)) return; seen.add(o.section); if (o.show !== false) shown.push(o); });
  const def = id => DEFAULT_SECTIONS.find(x => x[0] === id) || [id, id, id];
  document.getElementById("body").innerHTML = shown.map((o, i) => `<section id="${o.section}" style="--dot:${DOTS[i % DOTS.length]}">${SEC[o.section](o.label || def(o.section)[1])}</section>`).join("");
  document.getElementById("topnav").innerHTML = shown.map(o => `<a href="#${o.section}" data-id="${o.section}">${esc(o.menu || def(o.section)[2])}</a>`).join("");
  document.getElementById("foot").innerHTML = `<span>Made with chai and fairy lights by ${esc(first)}</span><span>${M.substack ? `<a href="${esc(M.substack)}" target="_blank" rel="noopener">Substack</a>` : ""}${F.instagram ? `<a href="${esc(F.instagram)}" target="_blank" rel="noopener">Instagram</a>` : ""}${W.linkedin ? `<a href="${esc(W.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}</span>`;

  /* typewriter greeting */
  (() => { const node = document.querySelector("#typed .txt"), text = A.hello || "";
    if (document.body.classList.contains("no-type") || matchMedia("(prefers-reduced-motion: reduce)").matches) { node.textContent = text; document.querySelector("#typed .caret")?.remove(); return; }
    let i = 0; (function tick() { node.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(tick, 70 + Math.random() * 45); })(); })();

  /* library */
  const note = document.getElementById("note");
  const showBook = i => { const b = books[i]; if (!b || !note) return;
    document.querySelectorAll(".spine").forEach(s => s.classList.toggle("on", +s.dataset.i === i)); document.querySelectorAll(".cd").forEach(c => c.classList.remove("on"));
    note.innerHTML = `${esc(b.title)}, <i>${esc(b.author)}</i>${b.rating ? " · " + "★".repeat(b.rating) : b.shelf ? ` · <i>${esc(b.shelf)}</i>` : ""}<br><i>${esc(b.note)}</i>`; };
  const showFilm = i => { const f = films[i]; if (!f || !note) return;
    document.querySelectorAll(".cd").forEach(c => c.classList.toggle("on", +c.dataset.i === i)); document.querySelectorAll(".spine").forEach(s => s.classList.remove("on"));
    note.innerHTML = `${esc(f.title)}${f.year ? ` <i>(${esc(f.year)})</i>` : ""}${f.score ? ` · ${esc(f.score)}/10` : ""}<br><i>${esc(f.note)}</i>`; };
  const firstBook = books.findIndex(b => b.shelf === "reading"); showBook(firstBook >= 0 ? firstBook : 0);

  /* lightbox */
  const lb = document.getElementById("lb");
  const openLb = (photo, key, ar, cap) => { document.getElementById("lb-img").style.cssText = `${bg(photo, key)};--ar:${ar}`; document.getElementById("lb-cap").innerHTML = cap; typeof lb.showModal === "function" ? lb.showModal() : lb.setAttribute("open", ""); };
  document.getElementById("lb-x").onclick = () => lb.close();
  lb.onclick = e => { if (e.target === lb) lb.close(); };
  document.getElementById("body").addEventListener("click", e => {
    const s = e.target.closest(".spine"); if (s) return showBook(+s.dataset.i);
    const c = e.target.closest(".cd"); if (c) return showFilm(+c.dataset.i);
    const p = e.target.closest(".pol"); if (p) { const t = photos[+p.dataset.i]; return openLb(t.photo, t.place, "4/3", `${esc(t.place)} <i>· ${esc(t.when)}</i>${t.story ? `<br>${esc(t.story)}` : ""}`); }
    const a = e.target.closest(".piece"); if (a) { const x = pieces[+a.dataset.i]; return openLb(x.photo, x.title, SHAPE[x.shape] || "4/5", `${esc(x.title)} <i>· ${esc(x.year)}${x.medium ? " · " + esc(x.medium) : ""}</i>`); }
  });
  document.querySelectorAll(".pol").forEach(p => p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); p.click(); } }));

  /* underline the section being read */
  const links = [...document.querySelectorAll("#topnav a")];
  const spy = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle("on", l.dataset.id === en.target.id)); }), { rootMargin: "-35% 0px -60% 0px" });
  document.querySelectorAll("main section").forEach(s => spy.observe(s));
  if (location.hash.length > 1) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}

/* light / dark switch */
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});
</script>
</body>
</html>
