<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jai Santhoshi Sathish Kumar</title>
<style>
/* One white page. A quiet lowercase index on the left, one narrow column of sections. Book Antiqua throughout, one terracotta accent, soft highlighter marks. */
:root {
  --bg: #FFFFFF;
  --ink: #24211E;
  --muted: #8C857D;
  --faint: #B7B0A8;
  --line: #EEEAE4;
  --accent: #B5522A;
  --hl: #F6E7B8;
  --hl2: #F3DCD2;
  --hl3: #DDE8E0;
  --wood: #A9825C; --wood-dark: #7C5A3B;
  --font: "Book Antiqua", "Palatino Linotype", Palatino, "URW Palladio L", P052, Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.65;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
mark { color: inherit; background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M2 9 C30 3 62 8 96 5 S160 2 198 7 L196 20 C150 23 110 18 70 21 S20 23 4 21 Z' fill='%23E8B86A' fill-opacity='.6'/></svg>") no-repeat 0 100% / 100% .85em; padding: 0 4px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.b { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M2 9 C30 3 62 8 96 5 S160 2 198 7 L196 20 C150 23 110 18 70 21 S20 23 4 21 Z' fill='%23E39A8F' fill-opacity='.6'/></svg>"); } mark.c { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 24' preserveAspectRatio='none'><path d='M2 9 C30 3 62 8 96 5 S160 2 198 7 L196 20 C150 23 110 18 70 21 S20 23 4 21 Z' fill='%239DBFA8' fill-opacity='.6'/></svg>"); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
i.k, .k { font-style: italic; color: var(--muted); font-size: 14px; }

/* layout: name and sections in a top bar, a string of fairy lights under it, one centred column */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.top-in { max-width: 860px; margin: 0 auto; display: flex; align-items: baseline; gap: 28px; padding-block: 18px 8px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.wordmark { font-style: italic; font-size: 21px; text-decoration: none; white-space: nowrap; flex: none; }
.wordmark span { color: var(--accent); }
#topnav { display: flex; gap: 20px; margin-left: auto; overflow-x: auto; scrollbar-width: none; min-width: 0; }
#topnav::-webkit-scrollbar { display: none; }
#topnav a { text-decoration: none; color: var(--muted); font-size: 15px; white-space: nowrap; padding-bottom: 2px; border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
#topnav a:hover { color: var(--ink); }
#topnav a.on { color: var(--ink); border-bottom-color: var(--accent); }
.lights { display: block; width: 100%; height: 22px; }
.lights path { fill: none; stroke: #CDBFAE; stroke-width: 1; }
.lights .b { animation: twinkle 2.4s ease-in-out infinite alternate; }
.lights .b circle:first-child { fill: #FFD98A; opacity: .45; }
.lights .b circle:last-child { fill: #F2B54B; }
@keyframes twinkle { from { opacity: .35; } to { opacity: 1; } }
.col { max-width: var(--colw, 680px); margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.typed { min-height: 1.2em; }
.caret { display: inline-block; width: .45em; height: .08em; background: var(--accent); margin-left: 3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
h2 { display: flex; align-items: center; gap: 12px; }
h2::before { content: ""; width: 15px; height: 13px; flex: none; border-radius: 52% 48% 55% 45% / 58% 46% 54% 42%; background: var(--dot, var(--accent)); opacity: .8; transform: rotate(-12deg); }
section:nth-of-type(2) h2 { --dot: #E8B86A; } section:nth-of-type(3) h2 { --dot: #B8475A; } section:nth-of-type(4) h2 { --dot: #7FA7C9; }
section:nth-of-type(5) h2 { --dot: #E39A8F; } section:nth-of-type(6) h2 { --dot: #8C6BC0; } section:nth-of-type(7) h2 { --dot: #9DBFA8; }
section:nth-of-type(8) h2 { --dot: #D9822B; } section:nth-of-type(9) h2 { --dot: #4F6D7A; } section:nth-of-type(10) h2 { --dot: #9C5B44; }
.signoff { font-style: italic; color: var(--muted); }
main { padding-block: 12vh 120px; display: grid; gap: 104px; min-width: 0; }
section { display: grid; gap: 16px; scroll-margin-top: 60px; min-width: 0; }
h1 { font-weight: 400; font-size: clamp(32px, 5vw, 42px); line-height: 1.15; margin: 0; letter-spacing: -.01em; }
h2 { font-weight: 400; font-size: 24px; margin: 0; letter-spacing: -.005em; }
p { margin: 0; }
.out { font-style: italic; font-size: 15px; color: var(--accent); text-decoration: none; width: fit-content; }
.out:hover { text-decoration: underline; text-underline-offset: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.inline-out { color: var(--accent); text-decoration: none; font-style: italic; }
.inline-out:hover { text-decoration: underline; text-underline-offset: 4px; }
.lb .story { font-size: 15px; color: var(--ink); }
.loading { color: var(--muted); font-style: italic; }

/* lists */
.rows { list-style: none; padding: 0; margin: 0; }
.rows li { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rows li:first-child { border-top: 1px solid var(--line); }
.rows a { text-decoration: none; min-width: 0; }
.rows a:hover { color: var(--accent); }
.rows .meta { font-style: italic; color: var(--muted); font-size: 14px; white-space: nowrap; }

/* library: books */
.shelf { display: flex; align-items: flex-end; gap: 3px; height: 170px; padding: 0 8px; overflow-x: auto; scrollbar-width: none; }
.plank { height: 7px; background: var(--wood); border-bottom: 3px solid var(--wood-dark); border-radius: 0 0 2px 2px; }
.spine { flex: none; border: 0; border-radius: 2px 2px 0 0; color: #FFFDF8; display: grid; place-items: center; padding: 10px 0; cursor: pointer; transition: transform .25s; box-shadow: inset 2px 0 0 rgba(255,255,255,.18), inset -3px 0 0 rgba(0,0,0,.14); }
.spine:hover, .spine:focus-visible, .spine.on { transform: translateY(-8px); }
.spine span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 100%; }
.note { min-height: 3.2em; font-size: 15.5px; }
.note i { color: var(--muted); }
/* library: CDs */
.rack { display: flex; gap: 16px; overflow-x: auto; padding: 14px 4px 18px; scrollbar-width: none; }
.cd { flex: none; width: 108px; height: 108px; margin-right: 34px; background: none; border: 0; padding: 0; cursor: pointer; position: relative; text-align: left; }
.cd .disc { position: absolute; top: 4px; left: 4px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #fff 0 9%, #D9D6D2 9.5% 11%, transparent 11.5%), conic-gradient(from 20deg, #E9E6F2, #F6E7D8, #DCEFE8, #E3E9F7, #F4DDE6, #E9E6F2); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .6s cubic-bezier(.3,1.2,.5,1); }
.cd .case { position: absolute; inset: 0; border-radius: 3px; overflow: hidden; box-shadow: 0 8px 16px -12px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.08); display: grid; align-content: end; padding: 8px 8px 8px 14px; color: #fff; }
.cd .case::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: rgba(0,0,0,.18); }
.cd .case::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.28), transparent 40%); }
.cd .case b { position: relative; z-index: 1; font-weight: 400; font-size: 13.5px; line-height: 1.1; }
.cd:hover .disc, .cd:focus-visible .disc { transform: translateX(28px) rotate(90deg); }
.cd.on .disc { animation: spin 3.2s linear infinite; }
@keyframes spin { from { transform: translateX(38px) rotate(0); } to { transform: translateX(38px) rotate(360deg); } }

/* travel: photos pegged on strings */
.strings { display: grid; gap: 26px; }
.string { position: relative; display: flex; justify-content: space-around; gap: 10px; padding-top: 14px; }
.string::before { content: ""; position: absolute; left: -6px; right: -6px; top: 8px; height: 26px; border-top: 1.5px solid #8C7A66; border-radius: 50% 50% 0 0 / 100% 100% 0 0; transform: scaleY(-1); transform-origin: top; }
.pol { position: relative; flex: none; width: 128px; margin: 0; padding: 7px 7px 0; background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 14px -10px rgba(0,0,0,.35); cursor: zoom-in; transform-origin: 50% -10px; transform: rotate(var(--r)); transition: transform .4s cubic-bezier(.3,1.5,.5,1); }
.pol:hover, .pol:focus-visible { transform: rotate(0deg) translateY(2px); }
.pol::before { content: ""; position: absolute; top: -12px; left: 50%; width: 8px; height: 20px; margin-left: -4px; background: #C99A63; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.pol .ph { display: block; aspect-ratio: 1; background-size: cover; background-position: center; }
.pol figcaption { font-size: 13px; font-style: italic; text-align: center; padding: 5px 0 7px; }

/* art */
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 24px; align-items: end; }
@media (max-width: 780px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.piece { width: 100%; background: none; border: 0; padding: 0; cursor: zoom-in; display: grid; gap: 8px; text-align: left; }
.frame { display: block; background: #2B2620; padding: 8px; box-shadow: 0 14px 22px -16px rgba(0,0,0,.6); transition: transform .3s; }
.frame .mat { display: block; background: #F8F4EC; padding: 10px; }
.frame .img { display: block; background-size: cover; background-position: center; }
.piece:hover .frame { transform: translateY(-3px); }
.piece .cap { font-size: 15px; line-height: 1.3; }
.piece .cap i { display: block; font-size: 13px; color: var(--muted); }

/* lightbox */
dialog { border: 0; padding: 0; background: transparent; max-width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(30, 27, 24, .55); }
.lb { background: #fff; border-radius: 6px; padding: 16px 16px 14px; display: grid; gap: 10px; position: relative; }
.lb .big { width: min(680px, calc(100vw - 64px)); aspect-ratio: var(--ar, 4/3); max-height: calc(100vh - 160px); background-size: cover; background-position: center; }
.lb p { font-size: 15px; } .lb p i { color: var(--muted); }
.lb .x { position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; font-size: 18px; }

footer { color: var(--faint); font-size: 13px; font-style: italic; }

@media (max-width: 780px) {
  .top-in { flex-direction: column; align-items: flex-start; gap: 8px; padding-block: 14px 4px; }
  #topnav { margin-left: 0; width: 100%; gap: 18px; }
  main { padding-block: 44px 90px; gap: 84px; }
  .pol { width: 104px; }
  .gallery { gap: 26px 16px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

/* design switches (set from the Site design form) */
body.no-lights .lights { display: none; }
body.no-dots h2::before { display: none; }
body.wall-grid .strings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
body.wall-grid .string { display: contents; }
body.wall-grid .string::before, body.wall-grid .pol::before { display: none; }
body.wall-grid .pol { width: auto; transform: none; }
body.gallery-2 .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 900px) {
  body.menu-left .top { position: fixed; top: 0; left: 0; bottom: 0; width: 210px; background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
  body.menu-left .top-in { flex-direction: column; align-items: flex-start; gap: 22px; height: 100%; justify-content: center; padding-left: max(28px, env(safe-area-inset-left, 0px)); }
  body.menu-left #topnav { flex-direction: column; gap: 6px; margin-left: 0; overflow: visible; }
  body.menu-left #topnav a { width: fit-content; }
  body.menu-left .lights { position: absolute; top: 0; right: -11px; width: 22px; height: 100%; }
  body.menu-left .col { margin-left: max(240px, calc((100vw - var(--colw, 680px)) / 2)); }
}
body { background: var(--bg); }
.top { background: color-mix(in srgb, var(--bg) 94%, transparent); }
</style>
</head>
<body>
<header class="top">
  <div class="top-in"><a class="wordmark" id="wordmark" href="#hello">Jai Santhoshi<span>.</span></a><nav id="topnav" aria-label="Sections"></nav></div>
  <svg class="lights" id="lights" viewBox="0 0 1000 22" preserveAspectRatio="none" aria-hidden="true"></svg>
</header>
<div class="col"><main id="main"><p class="loading">Loading…</p></main></div>
<dialog id="lb"><div class="lb"><button class="x" id="lb-x" aria-label="Close">×</button><div class="big" id="lb-img"></div><p id="lb-cap"></p></div></dialog>

<script>
/* ════════════════════════════════════════════════════════════════
   All words, links and photos live in the content/ folder,
   one file per section. Edit them in Pages CMS (app.pagescms.org).
   This file only decides how they look.
   ════════════════════════════════════════════════════════════════ */
const FILES = ["settings", "about", "musings", "library", "travel", "art", "podcast", "fitness", "impact", "work", "archive"];
const SECTIONS = [["musings", "Musings"], ["library", "Library"], ["travel", "Travel"], ["art", "Art"],
  ["ground-up", "Ground Up"], ["fitness", "Fitness"], ["impact", "Impact"], ["work", "Work"], ["archive", "Archive"]];

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = d => d ? new Date(String(d).slice(0, 10) + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }).toLowerCase() : "";
const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
const PAL = ["#2F4B7C", "#B8475A", "#3E7D6B", "#D9822B", "#6A4C93", "#C9A227", "#4F6D7A", "#9C5B44"];
const PAIRS = [["#7FA7C9", "#2F4B7C"], ["#E8A87C", "#B8475A"], ["#41B3A3", "#1F4E5F"], ["#E1C391", "#4F6D7A"], ["#C38D9E", "#6A4C93"], ["#E9D8A6", "#D9822B"], ["#C9A227", "#9C5B44"], ["#79A3A6", "#3E7D6B"]];
const pair = s => PAIRS[hash(s) % PAIRS.length];
const src = p => String(p || "").replace(/^\/+/, "");
const bg = (photo, key) => photo ? `background-image:url('${esc(src(photo))}')` : `background-image:linear-gradient(150deg, ${pair(key)[0]}, ${pair(key)[1]})`;
const SHAPE = { portrait: "4/5", square: "1/1", landscape: "4/3" };
const ext = (href, text) => href ? `<a class="inline-out" href="${esc(href)}" target="_blank" rel="noopener">${text} ↗</a>` : "";
const para = t => String(t || "").split(/\n\s*\n/).map(p => `<p>${esc(p.trim()).replace(/==(.+?)==/g, (m, w, i) => `<mark>${w}</mark>`)}</p>`).join("");
const byDate = (a, b) => String(b.date || "").localeCompare(String(a.date || ""));


/* ════════════ DESIGN: everything in content/settings.json ════════════ */
const ACCENTS = { terracotta: "#B5522A", plum: "#7A3E6B", forest: "#2F6B4F", "ink blue": "#2F4B7C", rose: "#B8475A", ochre: "#A8761E", charcoal: "#3A3632" };
const BACKGROUNDS = { white: "#FFFFFF", cream: "#FBF7EF", "warm grey": "#F5F3F0", blush: "#FCF5F3" };
const FONTS = {
  "book antiqua": { stack: '"Book Antiqua", "Palatino Linotype", Palatino, "URW Palladio L", P052, Georgia, serif' },
  "garamond": { stack: '"EB Garamond", Garamond, Georgia, serif', google: "EB+Garamond:ital,wght@0,400;0,500;1,400" },
  "modern sans": { stack: '"Instrument Sans", "Helvetica Neue", system-ui, sans-serif', google: "Instrument+Sans:ital,wght@0,400;0,500;1,400" },
  "typewriter": { stack: '"Courier Prime", "Courier New", monospace', google: "Courier+Prime:ital@0;1" },
  "elegant serif": { stack: '"Cormorant Garamond", Garamond, Georgia, serif', google: "Cormorant+Garamond:ital,wght@0,400;0,500;1,400" }
};
const WIDTHS = { narrow: "600px", medium: "680px", wide: "820px" };
const SIZES = { small: "16px", medium: "17px", large: "18.5px" };

function applyDesign(S) {
  const root = document.documentElement.style, body = document.body.classList;
  const font = FONTS[S.font] || FONTS["book antiqua"];
  if (font.google && !document.getElementById("gfont")) {
    const l = document.createElement("link"); l.id = "gfont"; l.rel = "stylesheet";
    l.href = `https://fonts.googleapis.com/css2?family=${font.google}&display=swap`; document.head.appendChild(l);
  }
  root.setProperty("--font", font.stack);
  root.setProperty("--accent", ACCENTS[S.accent] || (/^#/.test(S.accent || "") ? S.accent : ACCENTS.terracotta));
  root.setProperty("--bg", BACKGROUNDS[S.background] || "#FFFFFF");
  root.setProperty("--colw", WIDTHS[S.width] || WIDTHS.medium);
  document.body.style.fontSize = SIZES[S.text_size] || SIZES.medium;
  body.toggle("menu-left", S.menu === "left");
  body.toggle("no-lights", S.fairy_lights === false);
  body.toggle("no-dots", S.painted_dots === false);
  body.toggle("no-type", S.typewriter === false);
  body.toggle("wall-grid", S.photo_wall === "simple grid");
  body.toggle("gallery-2", String(S.gallery_columns) === "2");
}

function arrangeSections(S, P) {
  const main = document.getElementById("main"), footer = main.querySelector("footer");
  const DEFAULT = SECTIONS.map(([id, label]) => ({ section: id, label, show: true }));
  const list = Array.isArray(S.sections) && S.sections.length ? S.sections : DEFAULT;
  const seen = new Set(), nav = [];
  list.forEach(item => {
    const el = document.getElementById(item.section); if (!el || seen.has(item.section)) return;
    seen.add(item.section);
    if (item.show === false) { el.remove(); return; }
    main.insertBefore(el, footer);
    const label = item.label || (SECTIONS.find(x => x[0] === item.section) || [, item.section])[1];
    const h2 = el.querySelector("h2"); if (h2 && item.label) h2.textContent = item.label;
    nav.push(`<a href="#${item.section}" data-id="${item.section}">${esc(label)}</a>`);
  });
  SECTIONS.forEach(([id]) => { if (!seen.has(id)) document.getElementById(id)?.remove(); });
  document.getElementById("topnav").innerHTML = nav.join("");
}

Promise.all(FILES.map(f => fetch(`content/${f}.json`, { cache: "no-cache" }).then(r => r.ok ? r.json() : {}).catch(() => ({}))))
  .then(arr => render(Object.fromEntries(FILES.map((f, i) => [f, arr[i] || {}]))));

function render(C) {
  const A = C.about, M = C.musings, Lb = C.library, T = C.travel, Ar = C.art, P = C.podcast, F = C.fitness, I = C.impact, W = C.work, Ac = C.archive;
  const books = Lb.books || [], films = Lb.films || [], photos = T.photos || [], pieces = Ar.pieces || [];
  document.title = A.name || document.title;
  applyDesign(C.settings || {});

  const shortName = String(A.name || "Jai Santhoshi").split(" ").slice(0, 2).join(" ");
  document.getElementById("wordmark").innerHTML = `${esc(shortName)}<span>.</span>`;
  document.getElementById("topnav").innerHTML = SECTIONS.map(([id, n]) => `<a href="#${id}" data-id="${id}">${n}</a>`).join("");
  /* a string of fairy lights under the bar */
  const lights = document.getElementById("lights"); let d = "M0 4", bulbs = "";
  for (let x = 0; x <= 1000; x += 50) { d += ` Q${x + 25} 16 ${x + 50} 4`; }
  for (let k = 0, x = 25; x < 1000; x += 50, k++) bulbs += `<g class="b" style="animation-delay:-${(k * 0.37) % 2.4}s;animation-duration:${1.8 + (k % 5) * .3}s"><circle cx="${x}" cy="13" r="5"/><circle cx="${x}" cy="12.5" r="1.8"/></g>`;
  lights.innerHTML = `<path d="${d}"/>${bulbs}`;

  const marks = ["", "b", "c"]; let mi = 0;
  const intro = para(A.intro).replace(/<mark>/g, () => `<mark class="${marks[mi++ % 3]}">`);
  const spine = (b, i) => { const h = hash(b.title);
    return `<button class="spine" data-i="${i}" style="background:${PAL[h % PAL.length]};height:${112 + h % 46}px;width:${Math.min(38, 22 + String(b.title).length * .7)}px" aria-label="${esc(b.title)} by ${esc(b.author)}"><span>${esc(b.title)}</span></button>`; };
  const strings = []; photos.forEach((p, i) => { if (i % 3 === 0) strings.push([]); strings[strings.length - 1].push([p, i]); });

  document.getElementById("main").innerHTML = `
<section id="hello">
  <h1 class="typed" id="typed" aria-label="${esc(A.hello)}"><span class="txt" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span></h1>
  ${intro}
  ${A.email ? `<p class="signoff">Say hello at <span style="user-select:all">${esc(A.email)}</span></p>` : ""}
</section>

<section id="musings">
  <h2>Musings</h2>
  <p class="muted">${esc(M.line)} ${ext(M.substack, "Substack")}</p>
  <ul class="rows">${(M.posts || []).slice().sort(byDate).map(m => `<li><a href="${esc(m.url || M.substack)}" target="_blank" rel="noopener">${esc(m.title)} ↗</a><span class="meta">${fmt(m.date)}</span></li>`).join("")}</ul>
</section>

<section id="library">
  <h2>Library</h2>
  <p class="muted">${esc(Lb.line)}</p>
  <div><div class="shelf">${books.map(spine).join("")}</div><div class="plank"></div></div>
  <div class="rack">${films.map((f, i) => `<button class="cd" data-i="${i}" aria-label="${esc(f.title)}, ${esc(f.score)} out of 10"><span class="disc"></span><span class="case" style="background:linear-gradient(160deg, ${pair(f.title)[0]}, ${pair(f.title)[1]})"><b>${esc(f.title)}</b></span></button>`).join("")}</div>
  <p class="note" id="note" aria-live="polite"></p>
</section>

<section id="travel">
  <h2>Travel</h2>
  <p class="muted">${esc(T.line)}</p>
  <div class="strings">${strings.map(row => `<div class="string">${row.map(([p, i]) => `<figure class="pol" tabindex="0" role="button" data-i="${i}" style="--r:${(i % 2 ? 1 : -1) * (2 + i % 3)}deg"><span class="ph" style="${bg(p.photo, p.place)}"></span><figcaption>${esc(p.place)}</figcaption></figure>`).join("")}</div>`).join("")}</div>
</section>

<section id="art">
  <h2>Art</h2>
  <p class="muted">${esc(Ar.line)}</p>
  <div class="gallery">${pieces.map((a, i) => `<button class="piece" data-i="${i}" aria-label="View ${esc(a.title)}"><span class="frame"><span class="mat"><span class="img" style="aspect-ratio:${SHAPE[a.shape] || "4/5"};${bg(a.photo, a.title)}"></span></span></span><span class="cap">${esc(a.title)}<i>${esc(a.year)}${a.medium ? " · " + esc(a.medium) : ""}</i></span></button>`).join("")}</div>
</section>

<section id="ground-up">
  <h2>${esc(P.title || "Ground Up")}</h2>
  <p class="muted">${esc(P.line)} ${ext(P.youtube, "YouTube")}</p>
  <ul class="rows">${(P.episodes || []).slice().sort((a, b) => (b.number || 0) - (a.number || 0)).map(e => `<li><a href="${esc(e.url || P.youtube)}" target="_blank" rel="noopener">${esc(e.title)} ↗</a><span class="meta">ep ${esc(e.number)}${e.guest ? " · " + esc(e.guest) : ""}</span></li>`).join("")}</ul>
</section>

<section id="fitness">
  <h2>Fitness</h2>
  <p>${esc(F.text)} ${ext(F.instagram, "Instagram")}</p>
</section>

<section id="impact">
  <h2>Impact</h2>
  <ul class="rows">${(I.items || []).map(x => `<li><span>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)} ↗</a>` : esc(x.title)} <span class="muted">· ${esc(x.what)}</span></span><span class="meta">${esc(x.when)}</span></li>`).join("")}</ul>
</section>

<section id="work">
  <h2>Work</h2>
  <p class="muted">Where I've worked and studied. ${ext(W.linkedin, "LinkedIn")}${W.resume ? " · " + ext(src(W.resume), "Résumé") : ""}</p>
  <ul class="rows">${(W.roles || []).map(x => `<li><span>${esc(x.title)} <span class="muted">· ${esc(x.where)}</span></span><span class="meta">${esc(x.when)}</span></li>`).join("")}</ul>
</section>

<section id="archive">
  <h2>Archive</h2>
  <p class="muted">${esc(Ac.line)}</p>
  <ul class="rows">${(Ac.posts || []).slice().sort(byDate).map(x => `<li>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)} ↗</a>` : `<span>${esc(x.title)}</span>`}<span class="meta">${fmt(x.date)}</span></li>`).join("")}</ul>
</section>

<footer>Made with chai and fairy lights · ${new Date().getFullYear()}</footer>`;

  (function type() {
    const node = document.querySelector("#typed .txt"), text = A.hello || "";
    if (document.body.classList.contains("no-type") || matchMedia("(prefers-reduced-motion: reduce)").matches) { node.textContent = text; document.querySelector("#typed .caret")?.remove(); return; }
    let i = 0; (function tick() { node.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(tick, 75 + Math.random() * 45); })();
  })();

  /* library */
  const note = document.getElementById("note");
  const showBook = i => { const b = books[i]; if (!b) return;
    document.querySelectorAll(".spine").forEach(s => s.classList.toggle("on", +s.dataset.i === i)); document.querySelectorAll(".cd").forEach(c => c.classList.remove("on"));
    note.innerHTML = `${esc(b.title)}, <i>${esc(b.author)}</i>${b.rating ? " · " + "★".repeat(b.rating) : b.shelf ? ` · <i>${esc(b.shelf)}</i>` : ""}<br><i>${esc(b.note)}</i>`; };
  const showFilm = i => { const f = films[i]; if (!f) return;
    document.querySelectorAll(".cd").forEach(c => c.classList.toggle("on", +c.dataset.i === i)); document.querySelectorAll(".spine").forEach(s => s.classList.remove("on"));
    note.innerHTML = `${esc(f.title)}${f.year ? ` <i>(${esc(f.year)})</i>` : ""}${f.score ? ` · ${esc(f.score)}/10` : ""}<br><i>${esc(f.note)}</i>`; };
  const first = books.findIndex(b => b.shelf === "reading"); showBook(first >= 0 ? first : 0);

  /* lightbox */
  const lb = document.getElementById("lb");
  const openLb = (photo, key, ar, cap) => {
    document.getElementById("lb-img").style.cssText = `${bg(photo, key)};--ar:${ar}`;
    document.getElementById("lb-cap").innerHTML = cap;
    typeof lb.showModal === "function" ? lb.showModal() : lb.setAttribute("open", "");
  };
  document.getElementById("lb-x").onclick = () => lb.close();
  lb.onclick = e => { if (e.target === lb) lb.close(); };
  document.getElementById("main").addEventListener("click", e => {
    const s = e.target.closest(".spine"); if (s) return showBook(+s.dataset.i);
    const d = e.target.closest(".cd"); if (d) return showFilm(+d.dataset.i);
    const p = e.target.closest(".pol"); if (p) { const t = photos[+p.dataset.i]; return openLb(t.photo, t.place, "4/3", `${esc(t.place)} <i>· ${esc(t.when)}</i>${t.story ? `<br><span class="story">${esc(t.story)}</span>` : ""}`); }
    const a = e.target.closest(".piece"); if (a) { const x = pieces[+a.dataset.i]; return openLb(x.photo, x.title, SHAPE[x.shape] || "4/5", `${esc(x.title)} <i>· ${esc(x.year)}${x.medium ? " · " + esc(x.medium) : ""}</i>`); }
  });
  document.querySelectorAll(".pol").forEach(p => p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); p.click(); } }));

  /* underline the section being read */
  arrangeSections(C.settings || {}, P);
  const links = [...document.querySelectorAll("#topnav a")];
  const spy = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle("on", l.dataset.id === en.target.id)); }), { rootMargin: "-35% 0px -60% 0px" });
  document.querySelectorAll("main section").forEach(s => spy.observe(s));
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}
</script>
</body>
</html>
